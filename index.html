{id:416,cn:"Portulacaria afra",la:"Elephant Bush",light:"Requires bright light for at least 4–6 hours daily. A south- or east-facing window is ideal. Tolerates full sun to partial shade. Gradually acclimate to stronger light to prevent sunburn. Too little light causes leggy growth.",water:"Drought-tolerant; water when soil is completely dry, typically every 2–3 weeks. Use the soak-and-dry method. Reduce significantly in winter. Overwatering causes mushy stems and root rot.",temp:"Prefers 65–85°F (18–29°C). Tolerates brief dips to 40°F (4°C). Protect from frost. Average household humidity is sufficient.",soil:"Use a fast-draining cactus or succulent mix with added perlite or pumice. A terracotta pot with drainage holes is ideal. Repot every 2–3 years in spring.",fert:"Feed with a diluted succulent fertilizer monthly during spring and summer. Do not fertilize in fall or winter.",rep:"Repot every 2–3 years in spring. Choose a pot only slightly wider. Use fresh cactus mix. This plant prefers being slightly root-bound. Handle stems gently as they break easily.",growth:"A compact succulent shrub with small, round, bright green leaves on reddish-brown stems. Also called Spekboom or Jade's Cousin. Ideal for miniature bonsai. Reaches 1–3 feet indoors. Growth is moderate. An excellent carbon-sequestering plant used in ecological restoration in South Africa.",problems:["Mushy, translucent stems indicate overwatering","Leggy growth means the plant needs more light","Stems break easily; handle with care during repotting","Mealybugs may appear at stem joints; treat with alcohol swabs","Leaf drop may indicate overwatering or cold stress"],tox:"Non-toxic to humans and pets. Leaves are edible and used in traditional South African cuisine and as livestock fodder.",prop:"Very easy to propagate from stem cuttings. Take 3–4 inch cuttings, let callus for 2–3 days, then plant in dry cactus mix. Do not water for the first week. Roots develop in 2–4 weeks."},
{id:417,cn:"Crassula ovata",la:"Jade Plant",light:"Requires bright, indirect light for at least 4–6 hours daily. A south- or west-facing window is ideal. Tolerates some direct sun. Too little light causes leggy growth and leaf drop. Red edges on leaves indicate healthy light levels.",water:"Drought-tolerant; water every 2–3 weeks using the soak-and-dry method. Allow soil to dry completely between waterings. Reduce significantly in winter. Overwatering is the primary killer — mushy leaves indicate too much water.",temp:"Prefers 55–80°F (13–27°C). Protect from temperatures below 40°F (4°C) and frost. Tolerates dry air well. Average household temperatures are ideal.",soil:"Use a fast-draining cactus or succulent mix with added perlite or pumice. A terracotta pot with drainage holes is ideal. Repot every 2–3 years in spring.",fert:"Feed with a diluted succulent fertilizer at quarter strength monthly during spring and summer. Do not fertilize in fall or winter. Fresh potting mix provides sufficient nutrients.",rep:"Repot every 2–3 years in spring. Choose a pot only slightly wider. Use fresh cactus mix. Handle the brittle branches carefully. Older plants develop thick, gnarled trunks that add character.",growth:"A long-lived succulent shrub with thick, jade-green, oval leaves on sturdy branches. Also known as the Money Plant. Can reach 2–4 feet indoors and live for decades. After years of proper care, mature plants may produce clusters of small white or pink star-shaped flowers. Symbol of prosperity.",problems:["Mushy, translucent leaves indicate overwatering; stop watering immediately","Wrinkled leaves with dry soil indicate thirst","Leggy growth means the plant needs more light","White, cottony masses are mealybugs; treat with alcohol swabs","Can flower after many years of care — this is a sign of excellent growing conditions"],tox:"Mildly toxic to cats and dogs if ingested, causing vomiting, depression, and incoordination. Keep away from pets. Generally safe for humans.",prop:"Very easy to propagate from stem or leaf cuttings. Take a 3–4 inch stem cutting or a single leaf, let callus for 2–3 days, then place on dry cactus mix. Mist lightly. Roots develop in 2–4 weeks."},
{id:418,cn:"Echeveria",la:"Echeveria",light:"Requires bright light for at least 4–6 hours daily. A south-facing window is ideal. Some direct morning sun is beneficial. Insufficient light causes etiolation (stretching) and flattened rosettes. Rotate for even growth.",water:"Use the soak-and-dry method: water thoroughly, then allow soil to dry completely. Avoid getting water in the rosette center, which causes rot. Typical schedule: every 10–14 days in summer, every 3–4 weeks in winter.",temp:"Prefers 55–80°F (13–27°C). Most varieties are not frost-hardy; protect from temperatures below 32°F (0°C). Good air circulation is important in summer heat.",soil:"Use a gritty, fast-draining succulent or cactus mix with extra perlite or pumice. A terracotta pot with drainage holes is essential. Repot every 1–2 years in spring.",fert:"Feed with a diluted succulent fertilizer at quarter strength once a month during spring and fall. Do not fertilize in summer dormancy or winter. Over-fertilizing causes weak, leggy growth.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider than the rosette. Use fresh succulent mix. Remove dead lower leaves before repotting. Let damaged roots callus for 2–3 days before planting.",growth:"A diverse genus of rosette-forming succulents in shades of green, blue, pink, purple, and red. The tight, symmetrical rosettes are highly ornamental. Growth is slow to moderate. Many varieties produce offsets (chicks) around the base. Flower stalks emerge from the rosette center.",problems:["Stretching (etiolation) means the plant needs more light","Mushy, translucent leaves indicate overwatering","Remove dead lower leaves to prevent pests from hiding","Avoid getting water in the rosette center","Mealybugs hide between leaves; inspect and treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from leaf cuttings, offsets, or stem cuttings. Gently twist off a healthy leaf, let callus for 2–3 days, and place on dry succulent mix. Offsets can be separated and potted individually. Roots develop in 2–6 weeks."},
{id:419,cn:"Aeonium arboreum",la:"Black Rose / Tree Aeonium",light:"Requires bright light with some direct sun for best dark coloring. A south-facing window is ideal. In summer, provide afternoon shade to prevent sunburn. The dark rosette color intensifies with sun exposure.",water:"Reduce watering during summer dormancy (the plant may drop leaves). Water normally in fall, winter, and spring when the soil is dry. Use the soak-and-dry method. Overwatering in summer causes rot.",temp:"Prefers 50–75°F (10–24°C). Tolerates brief dips to 30°F (-1°C). Not frost-hardy. Thrives in cool, mild climates. Protect from extreme summer heat and freezing temperatures.",soil:"Use a well-draining succulent or cactus mix with extra perlite. Ensure the pot has drainage holes. Repot every 1–2 years in fall when active growth resumes.",fert:"Feed with a diluted succulent fertilizer monthly during the active growing season (fall through spring). Do not fertilize during summer dormancy.",rep:"Repot every 1–2 years in fall. Choose a pot 1–2 inches wider. Use fresh succulent mix. Handle the brittle rosettes carefully.",growth:"A striking succulent with dark burgundy to nearly black rosettes atop branching stems. Rosettes can reach 6–8 inches across. Growth is rapid in cool months (fall through spring). Enters summer dormancy with leaf curling and drop. Produces yellow flower spikes on mature rosettes; the flowering rosette dies after blooming but offsets survive.",problems:["Dark rosettes are very distinctive and intensify with sun exposure","Leaf curling and drop in summer is normal dormancy behavior","Rosettes may look stressed in summer; this is temporary","The flowering rosette dies after blooming; offsets continue growing","Stems become woody with age; this is normal"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem cuttings or offsets. Cut a rosette with 1–2 inches of stem, let callus for 3–5 days, then plant in dry succulent mix. Wait 1–2 weeks before watering. Best propagated in fall."},
{id:420,cn:"Sedum rubrotinctum",la:"Jelly Bean Plant",light:"Requires bright light for at least 6 hours daily to maintain compact shape and red coloration. A south-facing window is ideal. In low light, the plant stretches and turns entirely green. Strong sun produces the best red tips.",water:"Water thoroughly only when soil is completely dry, typically every 2–3 weeks. Drought-tolerant and prone to rot if kept wet. Reduce watering significantly in winter. The soak-and-dry method works best.",temp:"Prefers 65–75°F (18–24°C). Tolerates brief dips to 25°F (-4°C) but should be brought indoors if freezing is expected. Good air circulation prevents rot in humid conditions.",soil:"Use a gritty, fast-draining succulent mix with extra perlite. A terracotta pot with drainage holes is essential. Repot every 1–2 years in spring.",fert:"Fertilize sparingly — once each in spring and fall with a diluted succulent fertilizer at quarter strength. Over-fertilizing causes weak, green growth.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh succulent mix. Handle the fragile leaves carefully as they detach easily.",growth:"A trailing succulent with plump, bean-shaped leaves that turn from green to vivid red with sun exposure and temperature changes. Produces yellow star-shaped flowers in spring. Fallen leaves root readily and produce new plants. Growth is moderate. Most beautiful when slightly stressed by sun and drought.",problems:["Sun stress is beneficial; strong light and slight underwatering create the red tips","Fallen leaves root easily on the soil surface; this is natural propagation","Green coloring indicates insufficient light","Mushy leaves indicate overwatering; stop immediately","Mealybugs may hide at stem joints; treat with alcohol swabs"],tox:"Mildly toxic to pets if ingested, causing vomiting and lethargy. Keep away from cats and dogs. Generally safe for humans with normal handling.",prop:"Extremely easy. Fallen leaves root on their own. Place healthy leaves on dry succulent mix and mist lightly. Stem cuttings also root quickly. Allow cut ends to callus for 2–3 days before planting."},
{id:421,cn:"Cotyledon tomentosa",la:"Bear's Paw",light:"Prefers bright indirect light with some gentle morning sun. An east-facing window is ideal. Avoid harsh afternoon sun which can scorch the fuzzy leaves. At least 4 hours of bright light daily.",water:"Water when soil is completely dry, typically every 2–3 weeks. Use the soak-and-dry method. Avoid getting water on the fuzzy leaves — the fuzz should stay dry. Reduce significantly in summer dormancy.",temp:"Prefers 50–80°F (10–27°C). Protect from frost and temperatures below 32°F (0°C). Good air circulation is important. Reduce watering during summer dormancy.",soil:"Use a fast-draining succulent or cactus mix with extra perlite or pumice. A terracotta pot with drainage holes is ideal. Repot every 1–2 years in spring.",fert:"Feed with a diluted succulent fertilizer at quarter strength monthly during spring and fall. Do not fertilize in summer or winter.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh succulent mix. Handle the fuzzy leaves very gently to avoid damage.",growth:"A charming succulent with thick, oval leaves covered in fine white fuzz, resembling tiny bear paws. Leaf tips may develop reddish-brown 'claws.' Reaches 6–12 inches tall. Growth is slow to moderate. Produces orange, bell-shaped flowers on tall stalks in spring.",problems:["Fuzzy leaves should not get wet; water the soil directly","Leaf fuzz damage does not regenerate; handle with extreme care","Reduce watering during summer dormancy to prevent rot","Mealybugs may hide in the fuzz; inspect carefully and treat with a gentle neem oil spray","Leaf drop may indicate overwatering or cold stress"],tox:"Mildly toxic to pets and humans if ingested, causing gastrointestinal upset. Keep away from pets that may chew the leaves.",prop:"Propagate from stem cuttings. Take a 3–4 inch cutting, let callus for 3–5 days, then plant in dry succulent mix. Wait 1–2 weeks before watering. Leaf cuttings are less reliable for this species."},
{id:601,cn:"Lithops",la:"Living Stone",light:"Requires very bright light for 6–8 hours daily. A south- or east-facing window is ideal. Proper acclimation is critical — start with indirect light, then gradually introduce direct sun. Too little light causes elongated bodies and faded markings.",water:"The golden rule: when in doubt, do NOT water. Water only when soil is bone-dry. In spring, water lightly only if deeply wrinkled. In summer, very little or no water (dormancy). In fall (growing season), water sparingly. In winter, do NOT water during splitting.",temp:"Prefers 65–85°F (18–29°C) daytime with cooler nights. Avoid temperatures below 40°F (4°C). Protect from frost, cold drafts, and sudden temperature changes. Consistent warmth helps prevent stress and rot.",soil:"Requires excellent drainage in a mineral-based, gritty mix. Use cactus soil with extra pumice or perlite. A pot with drainage holes is non-negotiable. A gravel top dressing stabilizes the plant and keeps the base dry. Never use peat-heavy or moisture-retentive soil.",fert:"Rarely needs fertilizer. If desired, apply a very dilute succulent fertilizer (eighth strength) once in early fall. Over-fertilizing causes abnormal growth and increases rot risk.",rep:"Repot only when soil stays wet too long, becomes compacted, or roots are suffocating. Lithops prefer being slightly root-bound. Use a pot only slightly wider. Keep the plant at the same soil level — never bury the body. Wait 7–10 days before watering after repotting.",growth:"Desert succulents that mimic stones to avoid being eaten by animals. Each plant is a pair of fused leaves with a fissure between them. Growth follows a unique annual cycle: new leaves emerge from the center as old leaves shrivel (splitting). Growth is extremely slow. Each plant may follow the cycle at its own pace.",problems:["Soft or mushy base indicates rot from excess moisture; dry immediately and remove affected tissue","Sunburn or bleaching means the plant needs filtered light","Wrinkling should be evaluated alongside soil dryness before watering","Lack of visible growth is normal — Lithops grow very slowly","Overwatering after shipping is the number one cause of failure"],tox:"Generally non-toxic. Keep out of reach of pets to prevent damage to the plant. Not intended for consumption.",prop:"Lithops do not require pruning. Over time, some plants naturally form small clusters. Propagation is slow and entirely natural. Seed propagation is possible but takes years to reach maturity. Division of established clusters is the most practical method."},
{id:602,cn:"Haworthia cooperi",la:"Crystal Succulent",light:"Prefers bright indirect light. Avoid direct sun which can cause leaf burn or excessive browning. An east- or north-facing window is ideal. The translucent leaf tips (windows) allow light to penetrate for photosynthesis even when partially buried.",water:"Water when soil is completely dry, typically every 2–3 weeks. Reduce significantly during summer dormancy. Use the soak-and-dry method. Overwatering causes mushy, translucent leaves and root rot.",temp:"Prefers 50–80°F (10–27°C). Protect from frost and temperatures below 32°F (0°C). During summer dormancy, provide shade and good ventilation. Avoid hot, stuffy conditions.",soil:"Use a fast-draining succulent mix with extra perlite or pumice. A terracotta pot with drainage holes is ideal. The plant's roots are thick and fleshy; good drainage prevents rot. Repot every 1–2 years.",fert:"Feed with a diluted succulent fertilizer at quarter strength monthly during spring and fall. Do not fertilize in summer or winter.",rep:"Repot every 1–2 years in spring. Choose a deep pot to accommodate the thick roots. Use fresh succulent mix. Handle the fleshy roots gently.",growth:"A compact succulent with translucent, bubble-like leaf tips that resemble windows, allowing light to penetrate for photosynthesis. Forms small rosettes reaching 2–4 inches across. Growth is slow. Produces offsets around the base. One of the most unique and popular Haworthia species.",problems:["Translucent leaf tips are normal and essential for photosynthesis","Brown or red coloring may indicate sun stress; move to brighter indirect light","Mushy leaves indicate overwatering","Enclosing in a clear bag can enhance window transparency in low humidity","Slow growth is completely normal"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from offsets that form around the base. Gently separate with some roots attached and pot in dry succulent mix. Wait 1 week before watering. Leaf cuttings are possible but slow."},
{id:603,cn:"Haworthiopsis fasciata",la:"Zebra Haworthia",light:"Prefers bright indirect light. Tolerates some gentle morning sun. An east- or north-facing window is ideal. Too much direct sun causes reddish or brown coloring. Too little light causes etiolation.",water:"Water when soil is completely dry, typically every 2–3 weeks. Use the soak-and-dry method. Reduce significantly in summer and winter. Overwatering is the primary killer.",temp:"Prefers 50–80°F (10–27°C). Protect from frost and temperatures below 32°F (0°C). Good air circulation is important.",soil:"Use a fast-draining succulent mix with extra perlite or pumice. A small terracotta pot with drainage holes is ideal. This plant has a compact root system and prefers small pots.",fert:"Feed with a diluted succulent fertilizer at quarter strength monthly during the growing season (spring and fall). Do not fertilize in summer or winter.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh succulent mix. This plant prefers small, shallow pots.",growth:"A compact succulent with dark green leaves decorated with raised white horizontal stripes resembling a zebra pattern. Forms tight rosettes reaching 3–5 inches across. Growth is very slow. Produces offsets around the base. Ideal for small pots, terrariums (open), and desktop displays.",problems:["White stripes are a natural feature, not disease or pests","Reddish coloring may indicate sun stress; move to less direct light","Slow growth is completely normal","Mushy base indicates overwatering; stop immediately","Mealybugs may hide between leaves; inspect and treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from offsets that form around the base. Gently separate with some roots attached and pot in dry succulent mix. Wait 1 week before watering. Leaf cuttings are possible but slow and less reliable."},
{id:251,cn:"Sedum rubrotinctum",la:"Jelly Bean Plant (Duplicate)",light:"Requires bright, direct light (at least 6 hours a day) to maintain its compact shape and red coloration. In low light, it will stretch out (etiolate) and turn entirely green. A south-facing window is ideal.",water:"Water thoroughly only when the soil is completely dry. These plants are drought-tolerant and prone to rot if kept wet. Reduce watering significantly in winter. The soak-and-dry method works best.",temp:"Prefers temperatures between 65–75°F (18–24°C). It can tolerate brief dips down to 25°F (-4°C) but should be brought indoors if freezing is expected.",soil:"Use a gritty, fast-draining succulent mix with extra perlite. A terracotta pot with drainage holes is essential. Repot every 1–2 years in spring.",fert:"Feed with a balanced, water-succulent fertilizer diluted to half strength once during the spring growing season. Do not fertilize in winter.",rep:"Repot every 1–2 years in spring. Handle the fragile leaves carefully. Use fresh succulent mix and a pot only slightly wider.",growth:"A trailing succulent with plump, bean-shaped leaves that turn from green to vivid red with sun exposure. Fallen leaves root readily. Produces yellow star-shaped flowers in spring. Most beautiful when slightly stressed by sun and drought.",problems:["Sun stress is beneficial: strong light and slight underwatering create the beautiful red tips","Fallen leaves root easily on the soil surface — this is natural propagation","Watch for mealybugs (white cottony fluff) in the crevices where leaves meet the stem; treat with neem oil or alcohol swabs","Green coloring means insufficient light","Mushy leaves indicate overwatering"],tox:"Mildly toxic to pets if ingested, causing vomiting and lethargy. Keep away from cats and dogs.",prop:"Extremely easy. Fallen leaves root on their own. Stem cuttings also root quickly. Let cut ends callus for 2–3 days before planting in dry succulent mix."},
{id:252,cn:"Echeveria sp.",la:"Blue Echeveria",light:"Requires full sun to partial shade. At least 4–6 hours of direct sunlight is needed to keep the rosette tight. Insufficient light causes the plant to flatten and stretch (etiolate).",water:"Use the soak-and-dry method. Water deeply until it runs out the drainage holes, then wait until the soil is 100% dry before watering again. Avoid getting water on the leaves to prevent rot and damage to the protective farina coating.",temp:"Ideal range is 65–80°F (18–27°C). Most Echeverias are not frost-hardy and must be protected from temperatures below 25°F (-4°C).",soil:"Use a gritty, fast-draining succulent mix with extra perlite or pumice. Ensure the pot has large drainage holes. A terracotta pot is ideal.",fert:"Apply a low-nitrogen, high-phosphorus fertilizer in spring at quarter strength. Over-fertilizing causes weak, leggy growth.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh succulent mix. Remove dead lower leaves before repotting.",growth:"A rosette-forming succulent with powdery blue-green leaves. The farina (white powdery coating) protects from sunburn and pests. Growth is slow to moderate. Produces offsets and flower stalks.",problems:["Protect the farina: handle the plant by the base, not the leaves, to avoid wiping off the protective powder","Remove dead lower leaves to prevent pest harboring","Drainage is critical; use a gritty mix and a pot with holes","Stretching means the plant needs more light","Mealybugs hide between leaves; treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from leaf cuttings or offsets. Gently twist off a healthy leaf, let callus for 2–3 days, place on dry succulent mix. Offsets can be separated and potted. Roots develop in 2–6 weeks."},
{id:253,cn:"Crassula 'Buddha's Temple'",la:"Buddha's Temple",light:"Bright, indirect light to partial direct sun. East-facing windows are ideal. While they need light to stay compact, intense afternoon sun can scorch the stacked leaves.",water:"Allow the top inch of soil to dry out between waterings. Because the leaves are stacked tightly, water can get trapped inside the stem, leading to rot. Water carefully around the base, never from the top.",temp:"Prefers 60–75°F (15–24°C). Protect from drafts and freezing temperatures.",soil:"Use a fast-draining succulent or cactus mix with extra perlite. A small pot with drainage holes is ideal.",fert:"Feed monthly during the active growing season (spring/summer) with a balanced liquid fertilizer diluted to half strength.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh succulent mix.",growth:"A unique hybrid succulent with tightly stacked, overlapping leaves forming a square, pagoda-like column. Reaches 4–6 inches tall. Growth is slow. One of the most architecturally interesting succulents available.",problems:["Avoid top-watering: never pour water directly onto the stack; this causes inner leaves to rot","Top-heavy stability: as these grow tall, they become top-heavy and can tip over; use a heavy ceramic pot","Stem rot from trapped moisture between stacked leaves is the most common issue","Propagation by stem cuttings: cut a section, let callus for a few days, then plant in dry soil","Mealybugs hide between the tight leaves; inspect carefully"],tox:"Mildly toxic to pets if ingested. Keep away from cats and dogs.",prop:"Best propagated by stem cuttings. Cut a healthy section of the stack, let it callus for 3–5 days, then plant in dry succulent mix. Wait 1–2 weeks before watering."},
{id:254,cn:"Peperomia clusiifolia",la:"Red Edge Peperomia",light:"Prefers bright, indirect light. It can tolerate some direct morning sun, which helps maintain the red pigmentation in the leaves, but avoid harsh afternoon sun that can scorch them.",water:"Allow the top 1–2 inches of soil to dry out completely between waterings. As a semi-succulent, it stores water in its thick leaves and is prone to root rot if kept soggy.",temp:"Ideal range is 65–75°F (18–24°C). Avoid temperatures below 50°F (10°C) and keep away from cold drafts.",soil:"Use a well-draining potting mix with added perlite or orchid bark. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid houseplant fertilizer diluted to half strength once a month during spring and summer. Do not fertilize in fall and winter.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Use fresh, well-draining mix.",growth:"A bushy, semi-succulent perennial with thick, paddle-shaped leaves featuring distinctive red or pink margins. Reaches 8–12 inches tall. Growth is moderate. An excellent desktop or shelf plant with attractive, colorful foliage year-round.",problems:["Check leaf firmness: soft or mushy leaves indicate overwatering; wrinkled or shriveled leaves indicate thirst","Wipe the broad leaves gently with a damp cloth every few weeks to remove dust","Humidity matters: place on a pebble tray if your home is very dry","Stem rot from soggy soil is the most common cause of death","Mealybugs may appear in leaf axils; treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem or leaf cuttings. Take a 3–4 inch stem cutting with at least 2 leaves. Let the cut end callus for a day, then plant in moist, well-draining soil. Keep warm and lightly moist. Roots develop in 3–4 weeks."},
{id:255,cn:"Euphorbia lactea 'Cristata'",la:"Coral Cactus",light:"Requires very bright light. Ideally, place it in a south-facing window where it can get several hours of direct sunlight daily. Insufficient light will cause the crest to stretch and weaken.",water:"Water deeply but infrequently. Let the soil dry out completely before watering again. In winter, reduce watering significantly as the plant goes dormant.",temp:"Thrives in warm conditions between 70–85°F (21–29°C). It is sensitive to cold and should never be exposed to freezing temperatures.",soil:"Use a gritty cactus mix with added perlite or pumice. Standard potting soil holds too much moisture and will quickly rot the roots. Ensure excellent drainage.",fert:"Use a cactus/succulent-specific fertilizer during the active growing season (spring/summer). Apply sparingly, as too much nitrogen causes rapid, weak growth.",rep:"Repot every 2–3 years in spring. Handle with extreme care — wear gloves to avoid contact with the toxic sap. Use fresh cactus mix and a pot with drainage holes.",growth:"A grafted succulent featuring a fan-shaped, wavy crest (mutation) atop a straight stem. The crest comes in various colors including green, pink, purple, and white. Growth is slow. Most specimens sold are two species grafted together.",problems:["Watch for white sap: like all Euphorbias, this plant produces a milky white latex sap when cut or damaged. This sap is toxic and can irritate skin and eyes — always wear gloves when handling","Graft awareness: watch for any green shoots growing from the bottom stem and remove them immediately as they will divert energy from the crest","Well-draining soil is critical; standard potting soil causes rapid root rot","Crest stretching or thinning indicates insufficient light","Mealybugs may appear at the graft junction; treat with alcohol swabs"],tox:"The milky white latex sap is toxic and causes skin irritation, eye damage, and gastrointestinal distress if ingested. Always wear gloves when handling. Keep away from pets and children. Wash hands thoroughly after contact.",prop:"Propagation is rarely attempted at home as the crest form is a mutation that cannot be reliably reproduced from cuttings. Commercial specimens are created by grafting a crested Euphorbia lactea onto a Euphorbia neriifolia rootstock."},
{id:256,cn:"Euphorbia trigona",la:"African Milk Tree",light:"Requires bright, indirect light. A south or west-facing window is ideal. Can tolerate some direct sun but avoid harsh midday rays that can scorch the stems. Rotates toward light, so turn the pot regularly.",water:"Water deeply when the top 2–3 inches of soil are completely dry, typically every 2–3 weeks in summer. Reduce to once a month in winter. Overwatering causes stem rot quickly.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Not frost-tolerant.",soil:"Use a well-draining cactus or succulent mix with added perlite or pumice. Ensure excellent drainage with a pot that has multiple holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during the growing season (spring/summer). Do not fertilize in fall or winter.",rep:"Repot every 2–3 years in spring when the plant becomes top-heavy or roots fill the pot. Use gloves to avoid contact with the toxic sap. Choose a heavy pot to prevent tipping.",growth:"A striking upright succulent with triangular stems and small, short-lived leaves along the ridges. Can grow 4–6 feet tall indoors. Growth is moderate during warm months. May produce small flowers at stem tips.",problems:["White milky sap is toxic and causes skin/eye irritation — always wear gloves when pruning or handling","Overwatering is the #1 killer; stems become soft and mushy","Stems may lean toward light; rotate pot regularly for even growth","Leggy growth indicates insufficient light","Can become very top-heavy; use a heavy pot or stake tall stems"],tox:"The milky white latex sap is highly toxic and causes severe skin irritation, eye damage, and gastrointestinal distress if ingested. Always wear gloves and eye protection when pruning. Keep away from pets and children.",prop:"Propagate from stem cuttings. Cut a 4–6 inch section, let it dry and callus for 1–2 weeks, then plant in dry cactus mix. Water sparingly until established (4–8 weeks). Best propagated in spring or summer."},
{id:257,cn:"Haworthia fasciata",la:"Zebra Haworthia",light:"Prefers bright, indirect light. An east or north-facing window is ideal. Tolerates some direct morning sun but harsh afternoon rays can cause leaf reddening or scorching. Too little light causes etiolation (stretching).",water:"Water thoroughly when soil is completely dry, typically every 2–3 weeks. Reduce to once a month in winter. Avoid getting water in the leaf rosette center to prevent rot.",temp:"Prefers 65–80°F (18–27°C) during the day. Tolerates brief periods down to 50°F (10°C) but should be protected from frost.",soil:"Use a fast-draining cactus or succulent mix with added perlite or coarse sand. A shallow pot with drainage holes is ideal. Repot every 1–2 years in spring.",fert:"Feed with a diluted succulent fertilizer (quarter strength) once a month during the growing season (spring/fall). Do not fertilize in summer or winter when growth slows.",rep:"Repot every 1–2 years in spring when offsets crowd the pot or soil breaks down. Choose a pot only slightly wider. Use fresh cactus mix and wait 1 week before watering.",growth:"A compact, slow-growing succulent forming a rosette of dark green, triangular leaves with distinctive white, raised tubercles (stripes) resembling a zebra pattern. Reaches 3–5 inches tall and wide. Produces offsets freely at the base. Growth is very slow but the plant is long-lived.",problems:["Red or purple leaves indicate too much direct sun; move to brighter indirect light","Wrinkled, shriveled leaves mean the plant needs water","Soft, mushy leaves indicate overwatering; stop watering immediately and check for rot","Mealybugs hide in the leaf axils; inspect carefully and treat with alcohol swabs","Very slow grower; don't worry if it seems unchanged for months"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from offsets (pups) that form around the base. Gently separate pups with some roots attached and pot in dry cactus mix. Wait 1–2 weeks before watering. Can also be propagated from leaf cuttings, though slower. Best divided in spring."},
{id:258,cn:"Aloe juvenna",la:"Tiger Tooth Aloe",light:"Requires bright, indirect light to partial sun. A south or east-facing window is ideal. At least 4–6 hours of bright light daily for compact growth. Too little light causes etiolation (stretching and weak stems).",water:"Water deeply when soil is completely dry, typically every 2–3 weeks. Reduce to once a month in winter. Overwatering causes root rot quickly. Allow excess to drain completely.",temp:"Prefers 65–80°F (18–27°C). Tolerates brief periods down to 50°F (10°C) but is not frost-hardy. Protect from cold drafts.",soil:"Use a well-draining cactus or succulent mix with added perlite or pumice. Ensure excellent drainage. Repot every 1–2 years when offsets fill the pot.",fert:"Feed with a balanced succulent fertilizer diluted to half strength once in early spring. Avoid over-fertilizing, which causes weak, leggy growth.",rep:"Repot every 1–2 years in spring when offsets crowd the container. Divide offsets during repotting to reduce crowding or propagate new plants. Use fresh cactus mix.",growth:"A clustering succulent with triangular, toothed leaves arranged in rosettes. The leaves have small, white, tooth-like spines along the margins, giving the plant its common name. Forms dense clumps over time. Reaches 6–12 inches tall. Growth is moderate during warm months.",problems:["The small white teeth along leaf margins are sharp; handle with care","Overwatering is the most common cause of death; when in doubt, wait a few more days","Offsets freely; divide regularly to prevent overcrowding","Leggy growth indicates insufficient light","Mealybugs may hide in leaf axils; inspect and treat with alcohol swabs"],tox:"The leaf gel is mildly toxic and can cause skin irritation in sensitive individuals. Keep away from pets that may chew the leaves. Wear gloves when handling damaged leaves.",prop:"Propagate by dividing offsets that form around the base. Gently separate pups with roots attached and pot in dry cactus mix. Wait 1–2 weeks before watering. Best divided in spring or early summer."},
{id:259,cn:"Echeveria 'Red Edge'",la:"Red Edge Echeveria",light:"Requires full sun for at least 5–6 hours daily. A south-facing window or outdoor location is ideal. Strong light is essential to maintain the red-tipped leaf margins that give this cultivar its name. Insufficient light causes green leaves and etiolation.",water:"Use the soak-and-dry method. Water deeply until it runs out drainage holes, then wait until soil is completely dry before watering again (typically 2–3 weeks). Avoid getting water on the leaves to prevent rot. Reduce significantly in winter.",temp:"Prefers 65–80°F (18–27°C). Not frost-hardy; protect from temperatures below 32°F (0°C). Bring indoors before the first frost in cold climates.",soil:"Use a fast-draining cactus or succulent mix with added perlite or pumice. Ensure excellent drainage with a pot that has multiple holes. A terracotta pot helps prevent overwatering.",fert:"Apply a low-nitrogen succulent fertilizer diluted to half strength once in early spring. Avoid fertilizing in winter. Over-fertilizing causes weak, stretched growth.",rep:"Repot every 1–2 years in spring when the plant outgrows its pot or soil breaks down. Choose a pot only slightly wider. Use fresh cactus mix and wait 1 week before watering.",growth:"A stunning rosette-forming succulent with thick, spoon-shaped leaves that develop vibrant red, pink, or orange margins when exposed to strong light and slight drought stress. Reaches 4–6 inches tall and wide. Growth is slow to moderate. One of the most colorful Echeveria cultivars.",problems:["Color intensity depends on light: red edging intensifies with more sun and slight drought stress; in low light, leaves turn plain green","Preserve the farina (white powdery coating on leaves); it protects from sunburn. Handle by the base, not the leaves","Remove dead lower leaves gently to prevent pest hiding spots","Flower stalks drain energy; cut them off after blooming to redirect growth","Mealybugs hide in the leaf axils; inspect carefully and treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from leaf cuttings or offsets. For leaf cuttings: gently twist a healthy leaf from the stem, let it callus for 2–3 days, then place on dry cactus mix. Mist lightly until roots and a new plantlet form (4–8 weeks). Offsets can be separated and potted directly. Best propagated in spring or summer."}
];

const grid=document.getElementById("plantGrid");
const noResults=document.getElementById("noResults");
const countEl=document.getElementById("plantCount");
const overlay=document.getElementById("detailOverlay");
const panel=document.getElementById("detailPanel");
const searchInput=document.getElementById("searchInput");
let currentIdx=-1;

function renderGrid(list){
  if(!list.length){grid.innerHTML="";noResults.style.display="block";countEl.textContent="0 plants";return}
  noResults.style.display="none";
  countEl.textContent=`${list.length} plants`;
  grid.innerHTML=list.map((p,i)=>{
    const globalIdx=plants.findIndex(x=>x.id===p.id);
    return `<a class="card" onclick="openDetail(${globalIdx})">
      <div class="card-img">
        <img src="images/${p.id}.png" alt="${p.cn}" loading="lazy" onerror="this.style.display='none'">
        <span class="id-badge">#${String(p.id).padStart(3,"0")}</span>
      </div>
      <div class="card-body">
        <div class="card-cn">${p.cn}</div>
        <div class="card-la">${p.la}</div>
      </div>
    </a>`}).join("");
}

function filterPlants(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){renderGrid(plants);return}
  const filtered=plants.filter(p=>{
    const idStr=String(p.id).padStart(3,"0");
    return idStr.includes(q)||p.cn.toLowerCase().includes(q)||p.la.toLowerCase().includes(q)||p.id===parseInt(q)
  });
  renderGrid(filtered);
}

function openDetail(idx){
  currentIdx=idx;
  const p=plants[idx];
  const prev=idx>0?idx-1:-1;
  const next=idx<plants.length-1?idx+1:-1;
  let sections=`
    <div class="section-card light">
      <div class="section-header"><div class="section-icon">☀️</div><h3>Light & Sun Requirements</h3></div>
      <p>${p.light}</p>
    </div>
    <div class="section-card water">
      <div class="section-header"><div class="section-icon">💧</div><h3>Watering</h3></div>
      <p>${p.water}</p>
    </div>
    <div class="section-card temp">
      <div class="section-header"><div class="section-icon">🌡️</div><h3>Temperature & Climate</h3></div>
      <p>${p.temp}</p>
    </div>`;
  if(p.soil) sections+=`
    <div class="section-card soil">
      <div class="section-header"><div class="section-icon">🪴</div><h3>Soil & Potting</h3></div>
      <p>${p.soil}</p>
    </div>`;
  if(p.fert) sections+=`
    <div class="section-card fert">
      <div class="section-header"><div class="section-icon">🌱</div><h3>Fertilizing</h3></div>
      <p>${p.fert}</p>
    </div>`;
  if(p.rep) sections+=`
    <div class="section-card rep">
      <div class="section-header"><div class="section-icon">🔄</div><h3>Repotting</h3></div>
      <p>${p.rep}</p>
    </div>`;
  if(p.growth) sections+=`
    <div class="section-card growth">
      <div class="section-header"><div class="section-icon">🌿</div><h3>Growth & Appearance</h3></div>
      <p>${p.growth}</p>
    </div>`;
  if(p.problems&&p.problems.length) sections+=`
    <div class="section-card problems">
      <div class="section-header"><div class="section-icon">💡</div><h3>Care Tips & Common Issues</h3></div>
      <p>${p.problems.map(t=>`• ${t}`).join("<br>")}</p>
    </div>`;
  if(p.tox) sections+=`
    <div class="section-card tox">
      <div class="section-header"><div class="section-icon">⚠️</div><h3>Pet Safety & Toxicity</h3></div>
      <p>${p.tox}</p>
    </div>`;
  if(p.prop) sections+=`
    <div class="section-card prop">
      <div class="section-header"><div class="section-icon">✂️</div><h3>Propagation</h3></div>
      <p>${p.prop}</p>
    </div>`;

  panel.innerHTML=`
    <button class="detail-close" onclick="closeDetail()" aria-label="Close">✕</button>
    <div class="detail-hero">
      <div class="detail-img">
        <img src="images/${p.id}.png" alt="${p.cn}" onerror="this.style.display='none'">
      </div>
      <div class="detail-meta">
        <span class="detail-id">#${String(p.id).padStart(3,"0")}</span>
        <div class="detail-cn">${p.cn}</div>
        <div class="detail-la">${p.la}</div>
      </div>
    </div>
    <div class="detail-sections">${sections}</div>
    <div class="detail-nav">
      <button class="nav-btn ${prev>=0?"":"disabled"}" onclick="${prev>=0?`openDetail(${prev})`:""}">
        ← ${prev>=0?plants[prev].cn:"No more"}
      </button>
      <button class="nav-btn ${next>=0?"":"disabled"}" onclick="${next>=0?`openDetail(${next})`:""}">
        ${next>=0?plants[next].cn:"No more"} →
      </button>
    </div>`;
  overlay.classList.add("active");
  document.body.style.overflow="hidden";
}

function closeDetail(){
  overlay.classList.remove("active");
  document.body.style.overflow="";
  currentIdx=-1;
}

function showGallery(){
  closeDetail();
  searchInput.value="";
  filterPlants();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

renderGrid(plants);
</script>
</body>
</html>
