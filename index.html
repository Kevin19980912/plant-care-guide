{id:230,cn:"Jasminum sambac",la:"Jasmine",light:"Requires full sun for at least 6 hours daily for best flowering and fragrance. A south-facing window is ideal. More sun produces more flowers and stronger fragrance. Tolerates partial shade but flowering is reduced.",water:"Keep soil consistently moist during the growing season. Water when the top inch of soil feels dry, typically every 5–7 days. Increase frequency in summer heat. Reduce in winter. Never let soil dry out completely during active growth.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 50°F (10°C) and frost. Requires good air circulation. In cold climates, bring indoors before the first frost. Winter leaf drop is normal dormancy.",soil:"Use a rich, well-draining potting mix with added perlite. Slightly acidic pH (5.5–6.5) is preferred. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a phosphorus-rich fertilizer diluted to half strength every 2 weeks during the blooming period. Use a balanced fertilizer monthly during non-blooming growth. Stop in winter.",rep:"Repot every 1–2 years in spring. Choose a pot 1–2 inches wider. Provide a trellis or support for climbing varieties. Use fresh potting mix and prune lightly before repotting.",growth:"A fragrant tropical vine or shrub producing clusters of intensely fragrant white flowers. Can bloom up to three times a year under ideal conditions. Flowers are used in perfumery and tea. Growth is vigorous; prune after flowering to maintain shape and encourage branching.",problems:["Failure to bloom usually indicates insufficient light","Yellow leaves may indicate overwatering or nutrient deficiency","Leaf drop in winter is normal dormancy for some varieties","Spider mites and whiteflies may appear; treat with neem oil or insecticidal soap","Prune after flowering to encourage branching and prevent legginess"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from semi-hardwood stem cuttings taken in summer. Dip in rooting hormone and plant in moist, well-draining soil. Keep warm and humid. Roots develop in 4–6 weeks. Layering is also effective."},
{id:231,cn:"Gardenia jasminoides",la:"Gardenia",light:"Requires bright, indirect light for 4–6 hours daily. An east-facing window with morning sun is ideal. Avoid harsh afternoon sun which scorches leaves and fades flowers. Tolerates some direct morning sun.",water:"Keep soil consistently moist but not waterlogged. Water when the top inch of soil feels dry, typically every 5–7 days. Use room-temperature, acidic water (rainwater or add a few drops of vinegar to tap water). Avoid getting water on flowers.",temp:"Prefers 65–75°F (18–24°C) during the day and 60–65°F (15–18°C) at night. Protect from temperatures below 50°F (10°C). Requires high humidity (50–60%); mist daily or use a pebble tray. Avoid drafts and sudden temperature changes.",soil:"Requires acidic soil with pH 5.0–6.0. Use an azalea or camellia potting mix, or amend regular mix with peat moss. Ensure excellent drainage. Repot every 1–2 years in spring after flowering.",fert:"Feed with an acid-loving plant fertilizer (azalea/camellia formula) diluted to half strength every 2–4 weeks during spring and summer. Stop in fall and winter. Over-fertilizing causes leaf burn.",rep:"Repot every 1–2 years in spring after flowering. Choose a pot 1–2 inches wider. Use acidic potting mix. Handle the root ball gently. Water with acidic water after repotting.",growth:"An evergreen shrub prized for its intensely fragrant, creamy white, waxy flowers and glossy dark green leaves. Blooms from late spring through summer. Growth is moderate. Reaches 2–4 feet indoors. Considered one of the most rewarding but demanding houseplants.",problems:["Yellow leaves often indicate iron deficiency from alkaline water or soil; use acidic water","Bud drop is commonly caused by sudden temperature changes, dry air, or inconsistent watering","Brown flower edges suggest low humidity","Mealybugs, scale, and whiteflies are common pests; treat with neem oil","Avoid alkaline soil and water; gardenias require acidic conditions to thrive"],tox:"Mildly toxic to pets if ingested, causing vomiting and hives. Generally safe for humans. Keep away from cats and dogs that may chew leaves.",prop:"Propagate from semi-hardwood stem cuttings taken in summer. Dip in rooting hormone and plant in acidic, moist potting mix. Cover with a plastic bag for humidity. Roots develop in 4–8 weeks. Keep warm (70°F/21°C)."},
{id:232,cn:"Osmanthus fragrans",la:"Sweet Osmanthus",light:"Requires full sun for best flowering and fragrance. A south-facing window or outdoor location is ideal. Tolerates partial shade but flowering is significantly reduced. At least 6 hours of direct sun daily.",water:"Water when the top 2 inches of soil are dry. Established plants are moderately drought-tolerant. Water deeply and allow the top layer to dry before watering again. Reduce in winter. Avoid waterlogging.",temp:"Prefers 55–80°F (13–27°C). Fairly cold-hardy; tolerates brief dips to 20°F (-7°C) once established. In cold climates, bring potted plants indoors before hard frost. Protect from harsh winter winds.",soil:"Use a well-draining, slightly acidic to neutral potting mix. Add perlite or sand for drainage. Tolerates a range of soil types. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced fertilizer in spring and a phosphorus-potassium fertilizer in late summer to encourage fall blooming. Use at half strength monthly during the growing season. Stop in winter.",rep:"Repot every 2–3 years in spring. Choose a pot 2 inches wider. Prune lightly before repotting to maintain shape. Use fresh, well-draining mix.",growth:"An evergreen shrub or small tree prized for its intensely fragrant, tiny orange or white flowers that bloom in autumn. The fragrance carries for long distances. Flowers can be used to make osmanthus honey, tea, and cakes. Growth is slow to moderate; reaches 4–8 feet in containers.",problems:["Failure to bloom usually indicates insufficient light or incorrect fertilization","Leaf scorch from harsh afternoon sun in hot climates","Scale insects may appear on stems; treat with horticultural oil","Slow growth is normal; this plant is not fast-growing","Northern regions need indoor overwintering in pots; provide bright, cool conditions"],tox:"Non-toxic to cats, dogs, and humans. Flowers are edible and used in traditional Asian cuisine and beverages.",prop:"Propagate from semi-hardwood cuttings taken in late summer or early fall. Dip in rooting hormone and plant in moist, well-draining mix. Roots develop slowly (8–12 weeks). Air layering is also effective for larger specimens."},
{id:233,cn:"Bougainvillea",la:"Bougainvillea",light:"Requires full sun for at least 6–8 hours daily. A south-facing window or outdoor location is essential. Insufficient light prevents blooming entirely. The more sun, the more vibrant the bracts.",water:"Water deeply when the top 2 inches of soil are dry. Slight water stress can actually trigger blooming. Allow the plant to wilt slightly between waterings during the blooming period. Reduce significantly in winter. Avoid waterlogging.",temp:"Prefers 65–95°F (18–35°C). Protect from temperatures below 50°F (10°C) and frost. In cold climates, bring indoors before the first frost. Tolerates heat well with adequate watering.",soil:"Use a well-draining potting mix with added perlite or sand. Slightly acidic pH (5.5–6.5) is preferred. Ensure excellent drainage. A slightly root-bound condition encourages blooming. Repot every 2–3 years.",fert:"Feed with a high-phosphorus or bloom-booster fertilizer every 2 weeks during the blooming season. Use a balanced fertilizer during vegetative growth. Stop in winter.",rep:"Repot every 2–3 years in spring. Bougainvillea resents root disturbance; handle carefully. Choose a pot only slightly wider. Prune before repotting to manage size.",growth:"A vigorous tropical vine or shrub producing papery, colorful bracts (modified leaves) in pink, purple, red, orange, white, or yellow. The actual flowers are small and white, nestled inside the bracts. Blooms in cycles throughout warm months. Growth is fast; can reach 6–10 feet in containers with support.",problems:["Failure to bloom is almost always due to insufficient light or overwatering","Leaf drop may result from cold temperatures, drafts, or inconsistent watering","The colorful parts are bracts, not true flowers","Thorns on stems require careful handling during pruning and repotting","Northern regions need indoor overwintering; provide bright, cool conditions and reduce watering"],tox:"Mildly toxic to pets if ingested, causing mild gastrointestinal upset. Thorns can cause physical injury. Sap may cause skin irritation in sensitive individuals.",prop:"Propagate from semi-hardwood stem cuttings taken in spring or early summer. Dip in rooting hormone and plant in moist, well-draining mix. Keep warm and humid. Roots develop in 6–12 weeks. Layering is also effective."},
{id:234,cn:"Rosa chinensis",la:"Chinese Rose",light:"Requires full sun for at least 6 hours daily. A south-facing window or outdoor location is ideal. More sun produces more flowers and stronger growth. Insufficient light results in sparse blooms and weak stems.",water:"Keep soil consistently moist during the growing season. Water when the top inch of soil feels dry, typically every 5–7 days. Water at the base; avoid wetting leaves to prevent fungal diseases. Reduce in winter.",temp:"Prefers 60–75°F (15–24°C) during growth. Tolerates a wide range but performs best in moderate temperatures. Protect from extreme heat above 90°F (32°C) and hard frost. Good air circulation is essential.",soil:"Use a rich, well-draining potting mix with added compost or peat. Slightly acidic pH (6.0–6.5) is preferred. Ensure the pot has drainage holes. Repot every 1–2 years in early spring.",fert:"Feed with a rose-specific or balanced fertilizer every 2 weeks during the blooming season. Use a high-phosphorus formula to encourage flowering. Stop fertilizing 6 weeks before the first expected frost.",rep:"Repot every 1–2 years in early spring before new growth begins. Choose a pot 2 inches wider. Prune roots lightly and remove dead wood. Use fresh, rich potting mix.",growth:"A repeat-blooming rose that can flower year-round indoors under ideal conditions. Produces fragrant flowers in red, pink, yellow, white, and bi-colors. Growth is vigorous; prune regularly to maintain shape and encourage new flowering stems. Reaches 2–4 feet in containers.",problems:["Powdery mildew is common in humid, poorly ventilated conditions; improve air circulation","Spider mites and aphids are frequent pests; inspect regularly and treat with insecticidal soap","Black spot on leaves indicates fungal disease; remove affected leaves and improve airflow","Deadhead spent flowers promptly to encourage new blooms","Watch for cane borers; prune affected stems below the damage"],tox:"Rose petals are edible and non-toxic. However, thorns can cause physical injury. Some rose products (pesticides, fertilizers) may be toxic; handle with care.",prop:"Propagate from hardwood or semi-hardwood stem cuttings. Take 6–8 inch cuttings, remove lower leaves, dip in rooting hormone, and plant in moist potting mix. Roots develop in 4–8 weeks. Best propagated in late spring or early summer."},
{id:235,cn:"Hydrangea macrophylla",la:"Hydrangea",light:"Prefers partial shade to bright indirect light. Morning sun with afternoon shade is ideal. An east-facing window works well indoors. Avoid harsh afternoon sun which scorches leaves and fades flowers.",water:"Keep soil consistently moist during the growing season. Water when the top inch of soil feels dry, typically every 5–7 days. Hydrangeas are thirsty plants; increase watering in summer heat. Never let soil dry out completely.",temp:"Prefers 60–70°F (15–21°C). Cool night temperatures promote better blooming. Protect from temperatures below 32°F (0°C) and extreme heat above 85°F (29°C). In cold climates, bring potted plants indoors or provide winter protection.",soil:"Use a rich, well-draining potting mix. Soil pH directly affects flower color: acidic soil (pH below 6.0) produces blue flowers; alkaline soil (pH above 7.0) produces pink flowers. Ensure good drainage.",fert:"Feed with a balanced fertilizer monthly during spring and summer. To enhance blue flowers, use an acidic fertilizer. To enhance pink flowers, add lime. Stop fertilizing in late summer to allow the plant to harden off for winter.",rep:"Repot every 1–2 years in early spring before new growth begins. Choose a pot 2 inches wider. Use fresh potting mix with appropriate pH for desired flower color. Prune lightly before repotting.",growth:"A deciduous shrub producing large, rounded flower clusters (mophead or lacecap types) in blue, pink, purple, or white. Blooms from late spring through summer on old wood. Flower color is determined by soil pH and aluminum availability. Reaches 2–4 feet in containers.",problems:["Wilting is the first sign of underwatering; hydrangeas recover quickly when watered","Flower color fading may indicate incorrect soil pH","Powdery mildew is common in humid conditions; improve air circulation","Prune in late winter or early spring, removing only dead or weak stems","Aphids and spider mites may appear; treat with insecticidal soap or neem oil"],tox:"Toxic to pets and humans if ingested. Contains cyanogenic glycosides causing vomiting, diarrhea, and lethargy. Keep away from cats, dogs, and children.",prop:"Propagate from softwood cuttings taken in late spring or early summer. Take 4–6 inch cuttings, remove lower leaves, dip in rooting hormone, and plant in moist potting mix. Roots develop in 3–4 weeks. Layering is also very effective."},
{id:236,cn:"Lavandula",la:"Lavender",light:"Requires full sun for at least 6–8 hours daily. A south-facing window or outdoor location is essential. Insufficient light causes leggy growth, poor flowering, and weak fragrance. This plant thrives in the brightest possible conditions.",water:"Drought-tolerant once established. Water deeply when the top 2 inches of soil are completely dry, then allow to dry again. Overwatering is the most common killer. Reduce significantly in winter. Ensure excellent drainage at all times.",temp:"Prefers 60–80°F (15–27°C) during growth. Most varieties tolerate frost and brief cold. Good air circulation is more important than warmth. Avoid hot, humid, stagnant conditions which promote fungal disease.",soil:"Requires a lean, alkaline, fast-draining mix. Use cactus mix amended with coarse sand, gravel, or perlite. Avoid rich, moisture-retentive soils. A terracotta pot with drainage holes is ideal. pH 6.5–7.5.",fert:"Fertilize sparingly — once in spring with a balanced fertilizer at half strength is usually sufficient. Over-fertilizing produces excessive foliage with reduced flowering and fragrance. Lavender thrives in poor soil.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Trim roots lightly and remove dead wood. Use fresh, lean, well-draining mix. Prune the plant by one-third before repotting.",growth:"An aromatic, woody perennial prized for its fragrant flowers, silvery foliage, and calming scent. Produces spikes of purple, pink, or white flowers from late spring through summer. Reaches 1–3 feet depending on variety. Excellent for sachets, essential oils, and culinary use.",problems:["Overwatering and poor drainage cause root rot, the number one killer","Leggy, woody growth indicates insufficient light or lack of pruning","Prune by one-third after flowering to maintain shape and prevent woodiness","Avoid humid, stuffy conditions which promote gray mold (Botrytis)","Spider mites may appear in dry indoor conditions; mist occasionally"],tox:"Lavender is generally non-toxic to humans and is widely used in aromatherapy. However, essential oil is toxic to cats and dogs if ingested or applied topically. Keep essential oils away from pets.",prop:"Propagate from semi-hardwood cuttings taken in late summer. Take 3–4 inch cuttings, remove lower leaves, dip in rooting hormone, and plant in lean, well-draining mix. Roots develop in 3–4 weeks. Seed propagation is slow and unreliable."},
{id:237,cn:"Rosmarinus officinalis",la:"Rosemary",light:"Requires full sun for at least 6–8 hours daily. A south-facing window is ideal. Insufficient light causes sparse growth and loss of fragrance. Rosemary thrives in the brightest possible conditions and benefits from outdoor placement in summer.",water:"Drought-tolerant once established. Water deeply when the top 2 inches of soil are dry, then allow to dry. Overwatering causes root rot, the most common killer. Reduce significantly in winter. Ensure excellent drainage.",temp:"Prefers 55–80°F (13–27°C). Tolerates light frost but protect from hard freezes below 25°F (-4°C). Good air circulation is essential. Avoid hot, humid, stagnant conditions which promote powdery mildew.",soil:"Requires a lean, sandy, fast-draining mix. Use cactus mix amended with coarse sand or perlite. Alkaline pH (6.5–7.5) is preferred. A terracotta pot with drainage holes is ideal. Avoid rich, moisture-retentive soils.",fert:"Fertilize sparingly — once in spring with a balanced fertilizer at quarter strength is sufficient. Over-fertilizing reduces flavor and fragrance. Rosemary thrives in poor, lean soil.",rep:"Repot every 1–2 years in spring. Choose a pot only slightly wider. Trim roots lightly and prune the plant. Use fresh, lean, well-draining mix.",growth:"An aromatic, woody perennial herb with needle-like leaves and a distinctive piney fragrance. Essential culinary herb in Mediterranean cuisine. Produces small blue flowers in spring. Can be shaped through pruning. Reaches 2–4 feet. Tolerates heavy pruning and can be trained as a topiary.",problems:["Overwatering and poor drainage cause root rot, the primary killer","Powdery mildew is common in humid, poorly ventilated conditions","Browning leaves indicate underwatering or root rot; check soil moisture","Prune regularly to prevent woodiness and maintain shape","Spider mites may appear in dry indoor conditions; increase humidity slightly"],tox:"Non-toxic to humans in culinary amounts. Rosemary essential oil is toxic if ingested in large quantities. Generally safe for pets in normal household amounts but large quantities may cause stomach upset.",prop:"Propagate from semi-hardwood cuttings taken in spring or summer. Take 4–6 inch cuttings, remove lower leaves, strip bark from the bottom inch, and plant in moist, well-draining mix. Roots develop in 3–4 weeks. Water propagation also works."},
{id:238,cn:"Mentha",la:"Mint",light:"Prefers partial shade to full sun. Tolerates a wide range of light conditions. An east- or west-facing window is ideal. At least 4 hours of bright light daily. Too much direct sun in hot climates can scorch leaves.",water:"Keep soil consistently moist. Water when the top half-inch of soil feels dry, typically every 4–6 days. Mint is a thirsty plant and wilts quickly when dry. Ensure good drainage to prevent waterlogging.",temp:"Prefers 55–75°F (13–24°C). Very cold-hardy; most varieties survive frost and return in spring. Tolerates a wide temperature range. Avoid extreme heat above 90°F (32°C) without adequate moisture.",soil:"Use a rich, moisture-retentive potting mix. A standard potting mix with added compost works well. Ensure the pot has drainage holes. Always grow mint in a separate container as it aggressively spreads via underground runners.",fert:"Feed with a nitrogen-rich or balanced liquid fertilizer diluted to half strength monthly during the growing season. Over-fertilizing reduces flavor intensity. Fresh potting mix usually provides adequate nutrients.",rep:"Repot annually in spring as mint quickly fills containers with runners. Divide the root ball into sections and replant. Use fresh potting mix. Trim runners that extend beyond the pot to control spread.",growth:"A vigorous, fast-growing perennial herb with square stems and aromatic leaves. Spreads aggressively via underground runners (stolons). Pinch tips regularly to encourage bushy branching. Reaches 1–2 feet tall. Best grown in a dedicated container to prevent it from overtaking other plants.",problems:["Grows extremely fast; always plant in a separate pot to prevent it from overtaking neighbors","Leggy growth indicates insufficient light or lack of pinching","Rust fungus appears as orange spots on leaf undersides; remove affected leaves and improve air circulation","Pinch tips regularly to encourage branching and prevent flowering","Flowering reduces leaf flavor; pinch off flower buds as they appear"],tox:"Non-toxic to humans. Mint is widely used in cooking, teas, and beverages. Pennyroyal (Mentha pulegium) is toxic and should not be consumed. Keep essential oils away from pets and children.",prop:"Extremely easy to propagate. Take 4–6 inch stem cuttings, remove lower leaves, and place in water. Roots develop in 1–2 weeks. Can also be propagated by division of runners or root cuttings. Self-seeds readily."},
{id:239,cn:"Ocimum basilicum",la:"Basil",light:"Requires full sun for at least 6–8 hours daily. A south-facing window is ideal. Insufficient light causes leggy, weak growth with reduced flavor. Supplement with grow lights if natural light is inadequate.",water:"Keep soil consistently moist but not waterlogged. Water when the top half-inch of soil feels dry, typically every 4–6 days. Increase frequency in summer heat. Avoid wetting leaves to prevent fungal disease. Never let soil dry out completely.",temp:"Prefers 70–85°F (21–29°C). Extremely sensitive to cold; temperatures below 50°F (10°C) cause leaf blackening and damage. Protect from all frost. Bring indoors before cool autumn nights.",soil:"Use a rich, well-draining potting mix with added compost. Slightly acidic to neutral pH (6.0–7.0) is preferred. Ensure the pot has drainage holes. Repot or replace plants every few months as they decline after flowering.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2–3 weeks during the growing season. Avoid high-nitrogen fertilizers which produce lush but less flavorful leaves. Over-fertilizing reduces essential oil content.",rep:"Basil is typically grown as an annual and replaced every few months. If repotting, choose a pot 1–2 inches wider and use fresh, rich potting mix. Pinch the growing tip after repotting to encourage branching.",growth:"A fast-growing annual herb essential in Italian, Thai, and Mediterranean cuisine. Produces aromatic, flavorful leaves on bushy plants reaching 12–24 inches tall. Pinch tips regularly to encourage branching and maximize leaf production. Best harvested before flowering.",problems:["Pinch tips regularly to encourage bushy branching and delay flowering","Flowering reduces leaf flavor and signals the end of the plant's productive life","Downy mildew is a common disease; ensure good air circulation and avoid wetting leaves","Leggy growth indicates insufficient light or lack of pinching","Aphids may appear on new growth; treat with insecticidal soap or rinse with water"],tox:"Non-toxic to humans and pets. Basil is widely used in cooking and is safe for households with animals. Essential oil in concentrated form should not be ingested without guidance.",prop:"Easily grown from seed (germinates in 5–10 days) or propagated from stem cuttings. Take 4-inch cuttings, remove lower leaves, and place in water. Roots develop in 1–2 weeks. Succession-plant seeds every 2–3 weeks for continuous harvest."},
{id:240,cn:"Plectranthus tomentosa",la:"Cuban Oregano",light:"Prefers bright indirect light to partial sun. An east-facing window is ideal. Tolerates some direct morning sun. Too much intense afternoon sun can scorch the fuzzy leaves. Too little light causes leggy growth.",water:"Water when the top 1–2 inches of soil are dry, typically every 7–10 days. As a semi-succulent, it stores water in its thick leaves. Allow excess to drain completely. Reduce frequency in winter. Overwatering causes root rot.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 45°F (7°C) and frost. Average household humidity is sufficient. Avoid cold drafts and heating vents.",soil:"Use a well-draining potting mix with added perlite or sand. A cactus/succulent mix works well. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Do not fertilize in fall or winter. Over-fertilizing causes excessive, weak growth.",rep:"Repot every 1–2 years in spring. Choose a pot 1 inch wider. Use fresh, well-draining mix. Prune before repotting to maintain a compact shape.",growth:"A bushy, aromatic perennial with thick, fuzzy, succulent-like leaves that emit an apple-like or oregano-like scent when touched. Reaches 12–18 inches tall. Growth is moderate. Can be used in sachets or as a culinary herb substitute. Excellent for kitchens or herb gardens.",problems:["Leggy growth indicates insufficient light; pinch tips regularly for bushiness","Overwatering causes root rot and mushy stems","Leaves dropping may indicate overwatering or cold stress","Mealybugs may hide in leaf axils; inspect and treat with alcohol swabs","Prune regularly to maintain shape and encourage new growth"],tox:"Generally non-toxic to humans and pets. Leaves are used in traditional medicine and cooking in some cultures. Keep essential oils away from pets.",prop:"Very easy to propagate from stem cuttings. Take 4–6 inch cuttings, remove lower leaves, and place in water or moist soil. Roots develop in 1–2 weeks. Best propagated in spring or summer."},
{id:241,cn:"Mimosa pudica",la:"Sensitive Plant",light:"Requires bright, indirect light to full sun for at least 4–6 hours daily. A south- or east-facing window is ideal. Insufficient light causes leggy growth and reduced leaf movement. More light produces more responsive leaves.",water:"Keep soil consistently moist during the growing season. Water when the top half-inch of soil feels dry, typically every 4–6 days. Reduce slightly in winter. Use warm water; cold water may trigger leaf closure. Ensure good drainage.",temp:"Prefers 65–85°F (18–29°C). Protect from temperatures below 55°F (13°C) and cold drafts. Requires moderate to high humidity. A warm, humid bathroom or kitchen is ideal.",soil:"Use a well-draining, rich potting mix with added perlite. A peat-based mix retains moisture well. Ensure the pot has drainage holes. Repot annually as the plant grows quickly.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2 weeks during the growing season. Reduce to monthly in fall and winter.",rep:"Repot annually in spring. Choose a pot 1–2 inches wider. Use fresh potting mix. Handle the plant gently to minimize leaf closure during repotting.",growth:"A fascinating tropical annual or short-lived perennial known for its rapid leaf-folding response (thigmonasty) when touched. Leaves fold inward within seconds and reopen after several minutes. Produces pink, puffball-like flowers. Fast-growing; reaches 12–18 inches tall. A fun, interactive plant for children and educators.",problems:["Leaves folding frequently from handling may become less responsive over time; limit touching","Leggy growth indicates insufficient light","Spider mites thrive in warm, dry conditions; increase humidity","The plant has small thorns on stems; handle with care","Fast-growing; may need frequent repotting or pruning"],tox:"Non-toxic to humans and pets. Safe for households with children and animals. The leaf movement is a defense mechanism, not a sign of distress.",prop:"Propagate from seed (soak overnight before planting; germinates in 7–14 days) or from stem cuttings placed in moist soil. Seeds are the most common method. Best sown in spring in warm, moist conditions."},
{id:243,cn:"Nepenthes",la:"Tropical Pitcher Plant",light:"Prefers bright indirect light for 6–8 hours daily. An east-facing window is ideal. Some gentle morning sun is beneficial. Insufficient light reduces pitcher production. Avoid harsh midday sun which scorches leaves.",water:"Keep the soil consistently moist using purified, distilled, or rainwater only. Never use tap water; minerals and salts damage the roots. Maintain high humidity (60–80%). Keep a small amount of water in each pitcher.",temp:"Prefers 70–85°F (21–29°C) during the day with a 10°F drop at night. Protect from temperatures below 55°F (13°C). Requires consistently high humidity. A terrarium or humid room is ideal.",soil:"Use a nutrient-poor, acidic, well-draining mix: sphagnum moss and perlite in equal parts. Never use regular potting soil or fertilized mixes. Ensure excellent drainage. Repot every 1–2 years in spring.",fert:"Do not fertilize. Pitcher plants catch their own insects for nutrition. If grown indoors with few insects, place a small insect in a pitcher occasionally. Fertilizer burns the roots and kills the plant.",rep:"Repot every 1–2 years in spring using fresh sphagnum moss and perlite mix. Handle roots extremely gently. Do not fertilize after repotting. Keep in high humidity and bright indirect light during recovery.",growth:"A tropical carnivorous plant with modified leaves that form pitcher-shaped traps filled with digestive fluid. Insects are attracted by nectar and color, slip into the pitcher, and are digested. Vining species can climb several feet. Growth is moderate; new pitchers form continuously under ideal conditions.",problems:["Lack of pitcher production usually indicates insufficient light or humidity","Brown, dried pitchers are normal aging; trim with clean scissors","Use only purified or distilled water; tap water minerals kill the plant","Never add fertilizer to the soil or pitchers","Spider mites and thrips may appear; treat with a gentle rinse or neem oil at very low concentration"],tox:"Non-toxic to humans and pets. The digestive fluid inside pitchers is mildly acidic but not harmful to skin. Keep away from small children who may be tempted to taste the fluid.",prop:"Propagate from stem cuttings with at least 2–3 nodes. Place in moist sphagnum moss under high humidity and bright indirect light. Roots develop in 4–8 weeks. Air layering is also effective. Seed propagation is very slow."},
{id:244,cn:"Dionaea muscipula",la:"Venus Flytrap",light:"Requires very bright light for at least 6 hours daily. Full sun or a south-facing window is ideal. Supplement with a grow light if natural light is insufficient. More light produces redder trap interiors and healthier plants.",water:"Use only distilled, rainwater, or reverse-osmosis water. Keep soil consistently moist by sitting the pot in a shallow tray of water (tray method). Never let soil dry out completely. Never use tap water; minerals kill the plant.",temp:"Prefers 70–85°F (21–29°C) during the growing season. Requires a cool winter dormancy at 35–50°F (2–10°C) for 3–4 months. Without dormancy, the plant weakens and dies. Protect from hard frost during dormancy.",soil:"Use a nutrient-poor mix of sphagnum peat moss and perlite or silica sand (1:1 ratio). Never use regular potting soil, fertilized mixes, or anything containing minerals. A plastic pot with drainage holes is preferred over terracotta.",fert:"Do not fertilize. The plant catches its own insects for nutrition. If grown indoors, feed one small live insect per trap per month during the growing season. Never feed dead insects, meat, or fertilizer.",rep:"Repot every 1–2 years in late winter before growth resumes. Use fresh peat and perlite mix. Handle roots gently. Divide rhizomes if the plant has produced multiple crowns. Do not fertilize after repotting.",growth:"A carnivorous plant native to the coastal bogs of North and South Carolina. Modified leaves form hinged traps that snap shut when trigger hairs are touched twice. Each trap can close 3–5 times before dying. Growth is slow; a mature plant has 5–10 traps. Enters winter dormancy with reduced traps.",problems:["Never trigger traps unnecessarily; each trap has limited closures before dying","Black traps are normal aging; trim with clean scissors","Use only purified water; tap water minerals are the number one killer","Winter dormancy is essential; without it the plant dies within 1–2 years","Mold may develop on dead insects in traps; remove with tweezers"],tox:"Non-toxic to humans and pets. The traps cannot harm fingers or pets. Safe for households with curious animals and children.",prop:"Propagate by rhizome division during repotting. Separate crowns with their own roots. Leaf pullings can also produce plantlets: gently pull a trap with its white base, place on moist sphagnum moss, and keep humid. Seed propagation takes 3–5 years to maturity."},
{id:245,cn:"Tillandsia",la:"Air Plant",light:"Prefers bright indirect light for 6–8 hours daily. An east- or south-facing window is ideal. Tolerates some gentle morning sun. Avoid harsh afternoon sun and dark corners. Silver-leafed varieties tolerate more sun than green-leafed types.",water:"Soak in room-temperature water for 20–30 minutes once a week. After soaking, shake off excess water and place upside down to drain completely for 1–2 hours. Never leave water trapped in the base. Mist between soakings if the air is very dry.",temp:"Prefers 50–90°F (10–32°C). Protect from temperatures below 40°F (4°C) and frost. Thrives in warm, humid environments with good air circulation. Avoid cold drafts and heating vents.",soil:"No soil needed. Mount on driftwood, shells, rocks, or place in decorative containers. Ensure the mounting allows for air circulation and complete drying after watering. Never plant in soil or seal in a terrarium without ventilation.",fert:"Spray with a bromeliad or orchid fertilizer diluted to quarter strength once a month during the growing season (spring through fall). Mist the fertilizer solution onto the leaves. Do not fertilize in winter.",rep:"Not applicable — air plants are epiphytes and do not need repotting. Remount or rearrange as desired. Separate offsets (pups) when they reach one-third the size of the mother plant.",growth:"Epiphytic plants that absorb moisture and nutrients through specialized scales (trichomes) on their leaves. Produce colorful blooms once in their lifetime, after which they produce offsets (pups) before the mother plant slowly dies. Hundreds of species and varieties available. Growth is slow.",problems:["Brown, crispy leaf tips indicate underwatering or dry air","Soft, mushy base indicates overwatering or rot; reduce soaking time","Shake plants thoroughly after watering to prevent rot from trapped water","Silver-white scales on leaves are normal and essential for moisture absorption","After blooming, the mother plant produces pups before gradually declining"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets. Some pets may chew the leaves, which damages the plant but does not harm the animal.",prop:"Propagate from offsets (pups) that form at the base of the mother plant after blooming. Gently separate when pups reach one-third the mother's size. Seed propagation is possible but very slow (3–5 years)."},
{id:246,cn:"Aglaonema",la:"Chinese Evergreen",light:"One of the most shade-tolerant houseplants. Thrives in low to moderate indirect light. Avoid all direct sun which scorches and fades the colorful leaves. A north-facing window or fluorescent office lighting is sufficient.",water:"Water when the top 1–2 inches of soil are dry, typically every 7–10 days. Keep soil slightly moist but never waterlogged. Reduce frequency in winter. Yellow leaves usually indicate overwatering. Drooping indicates thirst.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Tolerates average household humidity but benefits from occasional misting. Avoid placing near heating vents or air conditioners.",soil:"Use a well-draining, peat-based potting mix with added perlite. Slightly acidic pH is preferred. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce to every 8 weeks in fall. Stop in winter. Variegated varieties benefit from slightly more fertilizer.",rep:"Repot every 1–2 years in spring when the plant becomes root-bound. Choose a pot 1–2 inches wider. Use fresh, well-draining mix. Aglaonema prefers being slightly root-bound.",growth:"A compact, bushy perennial prized for its beautifully patterned leaves in shades of green, silver, pink, and red. Growth is slow to moderate. One of the easiest and most forgiving houseplants. Excellent for offices, low-light rooms, and beginners.",problems:["Yellow leaves usually indicate overwatering","Brown leaf tips suggest low humidity, fluoride in water, or salt buildup","Faded leaf color indicates too much direct light","Leggy growth means the plant needs more indirect light","Mealybugs may appear in leaf axils; treat with alcohol swabs or neem oil"],tox:"Mildly toxic to pets and humans. Contains calcium oxalate crystals causing mouth irritation, drooling, and difficulty swallowing. Sap may cause skin irritation. Keep away from pets and children.",prop:"Propagate by division during repotting or from stem cuttings. Take a 4–6 inch cutting with at least 2–3 leaves and plant in moist potting mix. Can also be rooted in water. Best propagated in spring or early summer."},
{id:247,cn:"Syngonium podophyllum",la:"Arrowhead Plant",light:"Prefers bright indirect light but tolerates medium and low light. Variegated varieties need more light to maintain their color. Avoid direct sun which scorches leaves. An east- or north-facing window is ideal.",water:"Keep soil consistently moist during the growing season. Water when the top inch of soil feels dry, typically every 7–10 days. Reduce in winter. Drooping leaves indicate thirst; the plant recovers quickly after watering.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Prefers moderate to high humidity (40–60%). Mist regularly or use a pebble tray in dry environments.",soil:"Use a well-draining, peat-based potting mix with added perlite. Can be grown in water long-term. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce in fall; stop in winter. Variegated varieties benefit from regular feeding to maintain color.",rep:"Repot every 1–2 years in spring when root-bound. Choose a pot 1–2 inches wider. Use fresh potting mix. Provide a moss pole or trellis for climbing if desired.",growth:"A fast-growing tropical vine with arrow-shaped juvenile leaves that become lobed or divided as the plant matures. Leaf color varies widely by variety: green, white, pink, or burgundy. Can climb, trail, or be kept compact with pruning. More attractive when trained to climb.",problems:["Yellow leaves may indicate overwatering","Loss of variegation indicates insufficient light","Leggy growth can be corrected by pruning; cuttings root easily","Spider mites and mealybugs may appear; treat with neem oil","The plant can become top-heavy; provide support or prune regularly"],tox:"Mildly toxic to pets and humans. Contains calcium oxalate crystals causing mouth irritation, drooling, and vomiting if ingested. Sap may cause skin irritation. Keep away from pets and children.",prop:"Very easy to propagate from stem cuttings. Take 4–6 inch cuttings with at least one node. Place in water or moist soil. Roots develop in 1–2 weeks. Can also be propagated by division. Best done in spring or summer."},
{id:248,cn:"Caladium bicolor",la:"Caladium",light:"Prefers bright indirect light. Avoid direct sun which scorches the delicate, colorful leaves. An east- or north-facing window is ideal. Too little light causes faded colors and leggy growth.",water:"Keep soil consistently moist during the growing season. Water when the top inch of soil feels dry, typically every 5–7 days. Mist frequently to maintain high humidity. Reduce watering as leaves begin to die back in fall, signaling dormancy.",temp:"Prefers 70–85°F (21–29°C). Extremely sensitive to cold; protect from temperatures below 60°F (16°C). Requires high humidity. In fall, leaves die back naturally as the plant enters dormancy. Store tubers in dry peat moss at 60–70°F (16–21°C) during winter.",soil:"Use a rich, well-draining, peat-based potting mix. Slightly acidic pH is preferred. Ensure the pot has drainage holes. Plant tubers with the knobby side up, 1–2 inches deep. Repot tubers in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2 weeks during the growing season. Stop fertilizing in late summer as the plant prepares for dormancy.",rep:"Repot tubers annually in spring. Use fresh, rich potting mix. Divide tubers if the plant has become crowded. Plant with eyes (growth points) facing up.",growth:"A tropical tuberous plant prized for its stunning, heart-shaped leaves in vivid combinations of white, pink, red, and green. Leaves resemble oil paintings. Growth is seasonal: emerges in spring, thrives in summer, dies back in fall. Dormant tubers resprout in spring. Reaches 12–24 inches tall.",problems:["Winter dormancy with leaf dieback is completely normal; do not discard the tuber","Yellowing leaves during the growing season may indicate overwatering","Brown leaf edges suggest low humidity or dry soil","Leaves are fragile and tear easily; handle with care","New shoots emerge in spring from stored tubers; resume watering gradually"],tox:"Toxic to pets and humans if ingested. Contains calcium oxalate crystals causing intense mouth pain, drooling, and swelling. Sap causes skin irritation. Keep away from pets and children.",prop:"Propagate by dividing tubers during repotting in spring. Cut tubers into sections, each with at least one eye (growth point). Let cuts dry for a day before planting. Dust cuts with fungicide to prevent rot."},
{id:249,cn:"Maranta leuconeura",la:"Prayer Plant",light:"Prefers bright indirect light. Avoid all direct sun which fades the intricate leaf patterns and causes brown spots. A north- or east-facing window is ideal. Tolerates low light but patterns may be less vivid.",water:"Keep soil consistently moist but not waterlogged. Water when the top inch of soil feels dry, typically every 5–7 days. Use room-temperature, filtered water. Never let soil dry out completely. Reduce slightly in winter.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Requires high humidity (50–60%+). Mist daily, use a humidifier, or place on a pebble tray. A bathroom with bright indirect light is ideal.",soil:"Use a rich, well-draining, peat-based potting mix with added perlite. Slightly acidic pH (5.5–6.0) is preferred. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2–4 weeks during spring and summer. Reduce to monthly in fall. Stop in winter. Over-fertilizing causes brown leaf edges.",rep:"Repot every 1–2 years in spring. Choose a shallow pot (prayer plants have shallow root systems). Use fresh, peat-based mix. Divide the plant during repotting if it has become too large.",growth:"A tropical perennial famous for its nyctinastic movement: leaves fold upright at night (like praying hands) and open flat during the day. The leaf patterns are the main ornamental feature, with intricate designs in green, red, and silver. Reaches 8–12 inches tall. Growth is moderate.",problems:["Crispy brown leaf edges almost always indicate low humidity","Faded leaf patterns suggest too much direct light","Yellow leaves may indicate overwatering","Spider mites thrive in dry conditions; maintain high humidity and inspect regularly","Leaves not moving (folding at night) may indicate insufficient light or stress"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets and children.",prop:"Propagate by division during repotting. Separate the root ball into sections with healthy roots and shoots. Stem cuttings with at least one node can also be rooted in water. Best propagated in spring."},
{id:250,cn:"Strelitzia reginae",la:"Bird of Paradise",light:"Requires bright, indirect light to full sun for at least 6 hours daily. A south-facing window is ideal. Sufficient light is essential for flowering. Tolerates some direct sun indoors. Too little light produces lush foliage but no flowers.",water:"Water thoroughly when the top 2 inches of soil are dry, typically every 7–10 days during growth. Reduce in winter. Allow excess to drain completely. Overwatering causes root rot. Drooping leaves indicate thirst.",temp:"Prefers 65–85°F (18–29°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is acceptable but benefits from occasional misting. Avoid heating vents and air conditioners.",soil:"Use a rich, well-draining potting mix with added perlite or sand. Ensure the pot has drainage holes and is heavy enough to support the plant's size. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2–4 weeks during spring and summer. Reduce to monthly in fall. Stop in winter. A bloom-booster in spring encourages flowering.",rep:"Repot every 1–2 years in spring. Choose a heavy pot (terracotta) to prevent tipping. This plant prefers being slightly root-bound for best flowering. Use fresh, rich potting mix.",growth:"A dramatic tropical perennial native to South Africa with large, paddle-shaped leaves and spectacular orange and blue flowers that resemble a bird in flight. Can reach 4–6 feet indoors. Growth is moderate; plants typically take 3–5 years to bloom from seed. Requires generous space.",problems:["Failure to bloom usually indicates insufficient light, young age, or excessive fertilization","Splitting leaves are normal and do not indicate a problem","Brown leaf edges suggest underwatering, low humidity, or salt buildup","Scale insects and mealybugs may appear; treat with neem oil","Dust leaves monthly with a damp cloth to maintain photosynthesis"],tox:"Mildly toxic to cats and dogs if ingested, causing mild gastrointestinal upset. Seeds are more toxic than leaves. Generally safe for humans. Keep away from curious pets.",prop:"Propagate by division of mature plants during repotting. Separate suckers with their own root systems. Seed propagation is possible but takes 3–5 years to bloom. Soak seeds for 24 hours before planting."},
{id:401,cn:"Pachira aquatica",la:"Money Tree",light:"Prefers bright indirect light for 4–6 hours daily. An east- or west-facing window is ideal. Tolerates medium light and some shade. Avoid direct afternoon sun which scorches leaves. Rotate weekly for even growth.",water:"Water deeply every 10–14 days, allowing the top 2–3 inches of soil to dry between waterings. Overwatering is the most common cause of death. Allow excess to drain completely. Reduce in winter. Yellow leaves indicate overwatering.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is sufficient. Avoid placing near heating vents or air conditioners.",soil:"Use a well-draining potting mix with added perlite or sand. Ensure the pot has drainage holes. A pot that is not too large helps prevent overwatering. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce to every 8 weeks in fall. Stop in winter. Over-fertilizing causes leaf burn.",rep:"Repot every 2–3 years in spring when root-bound. Choose a pot only slightly wider. The braided trunk may need to be carefully untangled or left as is. Use fresh, well-draining mix.",growth:"A tropical tree native to Central and South America, commonly sold with braided trunks. Features glossy, palmate leaves with 5–9 leaflets. Can reach 6–8 feet indoors. Symbolizes wealth and prosperity in many Asian cultures. Growth is moderate in good light.",problems:["Yellow leaves and soft trunk indicate overwatering; stop watering and check drainage","Leaf drop may result from environmental changes, cold drafts, or overwatering","Braided trunks may rot if kept too wet; ensure the braid area stays dry","Spider mites may appear in dry conditions; increase humidity","Sticky residue on leaves may indicate scale insects; treat with neem oil"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem cuttings taken in spring or summer. Take 6–8 inch cuttings, dip in rooting hormone, and plant in moist, well-draining soil. Air layering is also effective. Braided specimens are typically propagated commercially."},
{id:402,cn:"Radermachera sinica",la:"China Doll",light:"Requires bright indirect light for 5–6 hours daily. An east- or west-facing window is ideal. Tolerates some gentle morning sun. Avoid direct afternoon sun and deep shade. Leaf drop is common when light is insufficient.",water:"Water when the top 1–2 inches of soil are dry, typically every 7–10 days. Keep soil slightly moist but never waterlogged. Reduce in winter. Leaf drop is the first sign of watering issues (too much or too little).",temp:"Prefers 65–75°F (18–24°C). Protect from temperatures below 50°F (10°C) and cold drafts. Sensitive to environmental changes; avoid moving the plant frequently. Average household humidity is sufficient.",soil:"Use a well-draining, all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce in fall; stop in winter.",rep:"Repot every 1–2 years in spring. Choose a pot 1–2 inches wider. Use fresh potting mix. Expect some leaf drop after repotting due to stress.",growth:"An elegant evergreen tree with lacy, bipinnate foliage that creates a dense, umbrella-like canopy. Can reach 4–6 feet indoors. Growth is moderate. Known for being sensitive to environmental changes; once settled, it thrives. Symbolizes family harmony in some cultures.",problems:["Leaf drop is the most common issue, triggered by environmental changes, drafts, or inconsistent watering","Ensure good air circulation to prevent fungal issues","Spider mites may appear in dry conditions; mist regularly","Prune lightly to maintain shape and encourage bushiness","Yellow leaves may indicate overwatering; check soil moisture"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem cuttings taken in spring or summer. Take 4–6 inch semi-hardwood cuttings, dip in rooting hormone, and plant in moist potting mix. Keep warm and humid. Roots develop in 4–8 weeks."},
{id:403,cn:"Cinnamomum kotoense",la:"Cinnamon Tree",light:"Prefers bright indirect light. An east- or west-facing window is ideal. Tolerates some gentle morning sun. Avoid harsh afternoon sun which scorches leaves. Too little light causes leggy growth.",water:"Keep soil slightly moist. Water when the top inch of soil feels dry, typically every 7–10 days. Reduce slightly in winter. Avoid waterlogging. Ensure good drainage.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is sufficient. Mist occasionally in dry environments.",soil:"Use a well-draining, rich potting mix with added perlite. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Stop in fall and winter.",rep:"Repot every 1–2 years in spring. Choose a pot 1–2 inches wider. Use fresh potting mix. Prune lightly to maintain shape.",growth:"An evergreen tree native to Orchid Island (Lanyu), Taiwan. Features glossy, aromatic leaves with a subtle cinnamon scent when crushed. Can reach 4–6 feet indoors. Growth is moderate. The leaves are the main ornamental feature; true cinnamon bark comes from Cinnamomum verum.",problems:["Leaf drop may result from cold drafts or overwatering","Brown leaf edges suggest low humidity or salt buildup","Scale insects may appear on stems; treat with neem oil","Slow growth is normal for this species","Ensure good air circulation to prevent fungal issues"],tox:"Non-toxic to humans. Leaves have a mild cinnamon aroma. Generally safe for pets but not intended for consumption.",prop:"Propagate from semi-hardwood stem cuttings taken in spring or summer. Dip in rooting hormone and plant in moist, well-draining mix. Keep warm and humid. Roots develop in 6–8 weeks."},
{id:404,cn:"Schefflera arboricola",la:"Umbrella Plant",light:"Prefers bright indirect light for 4–6 hours daily. Tolerates some shade and fluorescent lighting. Avoid direct afternoon sun. An east- or west-facing window is ideal. Variegated varieties need more light.",water:"Water when the top 1–2 inches of soil are dry, typically every 7–10 days. Allow excess to drain completely. Reduce in winter. Overwatering causes yellow leaf drop. Drooping indicates thirst.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is sufficient. Tolerates dry air better than most tropical plants.",soil:"Use a well-draining, all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce in fall; stop in winter.",rep:"Repot every 1–2 years in spring when root-bound. Choose a pot 1–2 inches wider. Prune before repotting to manage size. Use fresh potting mix.",growth:"A versatile tropical shrub with palmate leaves radiating from a central point like an umbrella. Can reach 4–8 feet indoors. Growth is fast in good light. Can be pruned heavily to maintain compact shape. Excellent air purifier. Also known as Parasol Plant.",problems:["Yellow leaf drop usually indicates overwatering","Leggy growth means the plant needs more light; prune to encourage branching","Sticky leaves may indicate scale insects or aphids; treat with neem oil","Brown leaf tips suggest low humidity or salt buildup","Tolerates heavy pruning; cut back to desired shape in spring"],tox:"Mildly toxic to cats and dogs if ingested, causing oral irritation, vomiting, and difficulty swallowing. Contains calcium oxalate crystals. Keep away from pets.",prop:"Propagate from stem cuttings taken in spring or summer. Take 4–6 inch cuttings, dip in rooting hormone, and plant in moist potting mix. Air layering is also effective for larger specimens. Roots develop in 4–6 weeks."},
{id:405,cn:"Dracaena marginata",la:"Dragon Tree",light:"Prefers bright indirect light. Tolerates low light but growth slows. An east- or north-facing window is ideal. Avoid direct afternoon sun which scorches leaf tips. Variegated varieties need brighter light.",water:"Drought-tolerant; water every 2–3 weeks when the top 2–3 inches of soil are dry. Allow excess to drain completely. Reduce in winter. Overwatering causes yellow leaf drop and root rot. Brown leaf tips may indicate fluoride in water.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Tolerates dry air well. Avoid placing near heating vents.",soil:"Use a well-draining, all-purpose potting mix with added perlite or sand. Ensure the pot has drainage holes. Prefers being slightly root-bound. Repot every 2–3 years.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer only. Do not fertilize in fall or winter. This plant requires minimal feeding.",rep:"Repot every 2–3 years in spring. Choose a pot only slightly wider. This plant prefers being slightly root-bound. Use fresh, well-draining mix.",growth:"A slender, architectural tree with a thin trunk topped by a crown of narrow, sword-like leaves with red or purple margins. Can reach 6–8 feet indoors. Growth is slow. Extremely low-maintenance and forgiving. The bare trunk adds sculptural interest.",problems:["Brown leaf tips are commonly caused by fluoride in tap water; use filtered or distilled water","Yellow lower leaves are normal aging; remove when fully yellow","Leaf drop may indicate overwatering or cold drafts","Spider mites may appear in dry conditions; wipe leaves regularly","Slow growth is completely normal for this species"],tox:"Toxic to cats and dogs if ingested, causing vomiting, drooling, and dilated pupils. Contains saponins. Keep away from pets. Generally safe for humans.",prop:"Propagate from stem cuttings or cane sections. Cut a healthy cane into 3–4 inch sections and plant horizontally in moist potting mix. Keep warm and lightly moist. New shoots emerge from the nodes in 4–8 weeks. Air layering is also effective."},
{id:406,cn:"Dracaena reflexa",la:"Song of India",light:"Prefers bright indirect light for 4–6 hours daily. Variegated leaves need good light to maintain their cream and green patterns. Tolerates medium light. Avoid direct afternoon sun.",water:"Water when the top 2 inches of soil are dry, typically every 10–14 days. Allow excess to drain completely. Reduce in winter. Drought-tolerant. Overwatering causes yellow leaf drop.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Average household humidity is sufficient.",soil:"Use a well-draining, all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Stop in fall and winter.",rep:"Repot every 2–3 years in spring. Choose a pot 1–2 inches wider. Use fresh potting mix. Prune to maintain shape before repotting.",growth:"A slow-growing, long-lived evergreen shrub with narrow leaves edged in cream or yellow-green, arranged in spirals along the stem. Can reach 3–6 feet indoors. Growth is slow but steady. Excellent for living room decor. The variegated foliage provides year-round color.",problems:["Brown leaf tips may indicate fluoride in water; use filtered or distilled water","Fading variegation means the plant needs more light","Yellow lower leaves are normal aging","Slow growth is typical for this species","Spider mites may appear in dry conditions; wipe leaves regularly"],tox:"Toxic to cats and dogs if ingested, causing vomiting, drooling, and loss of appetite. Contains saponins. Keep away from pets.",prop:"Propagate from stem cuttings taken in spring or summer. Take 4–6 inch cuttings, dip in rooting hormone, and plant in moist potting mix. Air layering is also effective. Roots develop in 4–8 weeks."},
{id:407,cn:"Dracaena fragrans",la:"Corn Plant",light:"Prefers bright indirect light. Tolerates low light well, making it one of the best office plants. An east- or north-facing window is ideal. Avoid direct sun which scorches leaves. Variegated varieties need moderate light.",water:"Water when the top 2 inches of soil are dry, typically every 7–10 days. Keep soil slightly moist but never waterlogged. Reduce in winter. Brown leaf tips may indicate fluoride in water or dry air.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Average household humidity is sufficient. Mist occasionally in very dry environments.",soil:"Use a well-draining, all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Stop in fall and winter.",rep:"Repot every 2–3 years in spring. Choose a pot 1–2 inches wider. Use fresh potting mix. Canes can be cut back to rejuvenate leggy plants.",growth:"A robust tropical plant with broad, arching leaves that emerge from thick, cane-like stems. Also known as Fragrant Dragon Tree. Can reach 4–6 feet indoors. Even bare cane sections can sprout new growth when placed in water or soil. Growth is moderate.",problems:["Brown leaf tips are commonly caused by fluoride in tap water; use filtered or distilled water","Yellow lower leaves are normal aging","Leggy canes can be cut back to encourage new shoots from the cut point","Sticky residue may indicate scale insects; treat with neem oil","Drooping leaves may indicate underwatering or root rot; check soil moisture"],tox:"Toxic to cats and dogs if ingested, causing vomiting, drooling, and depression. Contains saponins. Keep away from pets.",prop:"Propagate from cane cuttings. Cut a healthy cane into 3–4 inch sections and plant in moist potting mix or water. New shoots emerge from nodes in 4–8 weeks. Air layering is also effective for larger specimens."},
{id:408,cn:"Cycas revoluta",la:"Sago Palm",light:"Requires bright, indirect light to full sun for at least 6 hours daily. A south- or west-facing window is ideal. Tolerates some shade but growth is very slow. Gradually acclimate to stronger light to prevent leaf burn.",water:"Drought-tolerant; water every 2–3 weeks when the top 2–3 inches of soil are completely dry. Allow excess to drain completely. Overwatering causes root rot and yellowing fronds. Reduce significantly in winter.",temp:"Prefers 65–85°F (18–29°C). Tolerates brief dips to 25°F (-4°C) once established. Protect from sustained cold and frost. Good air circulation is important.",soil:"Use a very fast-draining cactus or sandy mix with added perlite or coarse sand. Excellent drainage is critical. A terracotta pot with drainage holes is ideal. Repot every 2–3 years.",fert:"Feed with a balanced fertilizer monthly during spring and summer. Add an iron supplement if fronds turn yellow (iron deficiency is common). Use at half strength.",rep:"Repot every 2–3 years in spring. Choose a pot only slightly wider. This plant prefers being root-bound. Handle the stiff, sharp fronds with care. Use fresh, fast-draining mix.",growth:"An ancient cycad (not a true palm) that has existed for over 200 million years. Features stiff, feathery, dark green fronds arranged in a rosette on a thick trunk. Growth is extremely slow — typically producing only 1–2 new fronds per year. Can live for decades. Reaches 2–4 feet indoors.",problems:["Yellow fronds usually indicate overwatering or iron deficiency; check soil and add iron supplement","Brown frond tips may indicate underwatering or salt buildup","Stiff, needle-like leaf tips can cause injury; place away from walkways","Mealybugs and scale may appear at the base of fronds; treat with alcohol swabs","Extremely slow growth is completely normal"],tox:"Highly toxic to pets and humans if ingested. All parts contain cycasin, which causes liver failure, vomiting, and potentially death. Seeds are the most toxic part. Keep well away from pets and children.",prop:"Propagate from offsets (pups) that form at the base of mature plants. Remove pups with a clean, sharp knife, let the cut dry for a week, then plant in fast-draining cactus mix. Water sparingly until roots establish (several months)."},
{id:409,cn:"Araucaria heterophylla",la:"Norfolk Island Pine",light:"Prefers bright indirect light for 6–8 hours daily. An east- or south-facing window is ideal. Rotate weekly for even growth. Tolerates some direct morning sun. Too little light causes branch drop and sparse growth.",water:"Keep soil consistently moist but not waterlogged. Water when the top inch of soil feels dry, typically every 7–10 days. Mist branches regularly to maintain humidity. Reduce slightly in winter but never let soil dry out completely.",temp:"Prefers 60–72°F (15–22°C). Protect from temperatures below 45°F (7°C) and cold drafts. Requires moderate to high humidity (40–50%+). Avoid heating vents and dry air which cause browning and branch drop.",soil:"Use a well-draining, slightly acidic potting mix with added perlite or sand. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Use a conifer-specific fertilizer if available. Stop in fall and winter.",rep:"Repot every 2–3 years in spring. Choose a pot 1–2 inches wider. Use fresh, well-draining mix. Handle branches gently. Stake the trunk if it leans.",growth:"A symmetrical, conical evergreen conifer native to Norfolk Island in the South Pacific. Features tiers of horizontal branches with soft, needle-like foliage. Can reach 6–10 feet indoors. Often used as a living Christmas tree. Growth is slow to moderate. Requires generous space.",problems:["Brown branch tips usually indicate low humidity or dry air","Branch drop is commonly caused by insufficient light, dry air, or inconsistent watering","Needle browning may indicate overwatering or root rot","Avoid dry conditions; this plant needs consistent moisture and humidity","Leaning trunk can be corrected with a stake and regular rotation toward light"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from the growing tip (terminal cutting) only. Side branch cuttings do not develop an upright growth habit. Take a 4–6 inch tip cutting, dip in rooting hormone, and plant in moist potting mix. Keep humid. Very slow to root."},
{id:410,cn:"Podocarpus macrophyllus",la:"Buddhist Pine",light:"Prefers full sun to partial shade. An east- or south-facing window is ideal. Tolerates shade but growth is slower. Adaptable to a wide range of light conditions.",water:"Water when the top 1–2 inches of soil are dry, typically every 7–10 days. Allow excess to drain. Reduce in winter. Drought-tolerant once established. Overwatering causes yellow needle drop.",temp:"Prefers 50–80°F (10–27°C). Fairly cold-hardy; tolerates brief dips to 20°F (-7°C) once established. Protect from hard frost in containers. Good air circulation is beneficial.",soil:"Use a well-draining potting mix with added perlite or sand. Slightly acidic to neutral pH is preferred. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Stop in fall and winter.",rep:"Repot every 2–3 years in spring. Choose a pot 1–2 inches wider. Prune roots lightly. Use fresh, well-draining mix. This plant tolerates being slightly root-bound.",growth:"An elegant evergreen conifer with dark green, lance-shaped leaves arranged spirally on the branches. A traditional bonsai species symbolizing longevity and good fortune. Can reach 4–8 feet indoors or be maintained as a bonsai. Tolerates heavy pruning and shaping. Growth is moderate.",problems:["Yellow needle drop usually indicates overwatering","Brown leaf tips may indicate dry air or underwatering","Scale insects may appear on stems; treat with horticultural oil","Tolerates heavy pruning; trim to maintain desired shape","Slow growth in low light is normal; provide more light for faster growth"],tox:"Mildly toxic if ingested. Seeds and foliage contain compounds that may cause gastrointestinal upset. Keep away from pets and children who may chew leaves.",prop:"Propagate from semi-hardwood cuttings taken in late summer. Dip in rooting hormone and plant in moist, well-draining mix. Keep warm and humid. Roots develop slowly in 8–12 weeks. Seed propagation is possible but very slow."},
{id:411,cn:"Serissa japonica",la:"Snow Rose",light:"Requires bright, indirect light for at least 4–6 hours daily. An east-facing window is ideal. Tolerates some gentle morning sun. Avoid harsh afternoon sun and deep shade. Insufficient light reduces flowering.",water:"Keep soil consistently moist but not waterlogged. Water when the top half-inch of soil feels dry, typically every 5–7 days. Reduce slightly in winter. Avoid both drought and waterlogging. Leaf drop is the first sign of watering stress.",temp:"Prefers 60–75°F (15–24°C). Protect from temperatures below 45°F (7°C) and cold drafts. Average household humidity is sufficient. Sensitive to environmental changes.",soil:"Use a well-draining bonsai or all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2 weeks during spring and summer. Reduce to monthly in fall. Stop in winter.",rep:"Repot every 1–2 years in spring. Choose a shallow bonsai pot. Prune roots lightly. Use fresh, well-draining mix. This plant resents frequent disturbance.",growth:"A compact, bushy evergreen shrub prized for its profuse small white flowers that appear like snow in summer, hence the common name. A traditional bonsai species. Reaches 12–18 inches as a bonsai. Growth is moderate. Responds well to pruning and wiring.",problems:["Leaf drop is commonly triggered by environmental changes, drafts, or inconsistent watering","Yellow leaves may indicate overwatering","Ensure good drainage to prevent root rot","Prune after flowering to maintain shape","Spider mites may appear in dry conditions; mist regularly"],tox:"Non-toxic to humans and pets. Safe for households with animals.",prop:"Propagate from semi-hardwood cuttings taken in spring or summer. Take 3–4 inch cuttings, dip in rooting hormone, and plant in moist potting mix. Keep warm and humid. Roots develop in 4–6 weeks."},
{id:412,cn:"Ficus microcarpa",la:"Ficus Bonsai",light:"Requires bright, indirect light for 6–8 hours daily. A south- or east-facing window is ideal. Tolerates some direct morning sun. Avoid deep shade. Rotate regularly for even growth.",water:"Keep soil consistently moist but not waterlogged. Water when the top half-inch of soil feels dry, typically every 5–7 days. Mist frequently to maintain humidity. Reduce slightly in winter.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Sensitive to environmental changes. Avoid heating vents and air conditioners.",soil:"Use a well-draining bonsai mix or all-purpose mix with added perlite and bark. Ensure the pot has drainage holes. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2 weeks during spring and summer. Reduce to monthly in fall and winter. Use a bonsai-specific fertilizer for best results.",rep:"Repot every 1–2 years in spring. Choose a bonsai pot or shallow container. Prune roots by one-third. Use fresh bonsai mix. Wire branches for shaping if desired.",growth:"A popular bonsai species with small, glossy, oval leaves and the ability to develop impressive aerial roots that create a banyan-like effect. Can reach 1–3 feet as a bonsai. Growth is moderate. Tolerates heavy pruning and recovers well. One of the best bonsai choices for beginners.",problems:["Leaf drop is commonly triggered by environmental changes, drafts, or inconsistent watering","Yellow leaves may indicate overwatering","Sticky residue may indicate scale insects; treat with neem oil","Aerial roots are desirable for bonsai aesthetics; maintain high humidity to encourage them","Prune regularly to maintain shape and encourage ramification"],tox:"Mildly toxic to pets and humans. The milky sap causes skin irritation and oral irritation if ingested. Wear gloves when pruning. Keep away from pets.",prop:"Propagate from stem cuttings or air layering. Take 4–6 inch cuttings, dip in rooting hormone, and plant in moist bonsai mix. Aerial roots can be guided into the soil to form new trunks. Best propagated in spring or summer."},
{id:413,cn:"Ulmus parvifolia",la:"Chinese Elm Bonsai",light:"Requires bright light for at least 6 hours daily. An east- or south-facing window is ideal. Can be grown outdoors in partial shade during summer. Deciduous; may lose leaves in autumn/winter dormancy.",water:"Water when the top half-inch of soil feels dry, typically every 5–7 days during growth. Keep soil moist but not waterlogged. Reduce significantly during winter dormancy when leaves have dropped.",temp:"Prefers 60–75°F (15–24°C) during growth. Tolerates a wide range. Requires a cool dormancy period at 35–50°F (2–10°C) for 4–6 weeks in winter for best health. Protect from hard frost in containers.",soil:"Use a well-draining bonsai mix of akadama, pumice, and lava rock (or substitute with bonsai soil and perlite). Ensure excellent drainage. Repot every 1–2 years in early spring before bud break.",fert:"Feed with a balanced bonsai fertilizer every 2 weeks during spring and summer. Reduce to monthly in fall. Stop during winter dormancy.",rep:"Repot every 1–2 years in early spring before new growth begins. Prune roots by one-third. Use fresh bonsai mix. Wire branches for shaping during dormancy.",growth:"A popular deciduous bonsai species with small, serrated leaves and attractive, mottled bark that exfoliates in patches of gray, green, and orange. Reaches 1–2 feet as a bonsai. Autumn/winter leaf drop is normal dormancy. Growth is fast; responds excellently to pruning.",problems:["Leaf drop in autumn/winter is completely normal dormancy","Yellow leaves during the growing season may indicate overwatering","Attractive mottled bark is a natural feature, not a disease","Aphids and spider mites may appear; treat with insecticidal soap","Prune heavily in late winter to shape; new buds break readily from old wood"],tox:"Non-toxic to humans and pets. Safe for households with animals.",prop:"Propagate from hardwood cuttings taken in late winter or softwood cuttings in summer. Dip in rooting hormone and plant in moist bonsai mix. Seed propagation is also possible. Air layering is effective for larger specimens."},
{id:414,cn:"Buxus sinica",la:"Boxwood Bonsai",light:"Prefers bright indirect light. Tolerates partial shade. An east- or north-facing window is ideal. Avoid harsh direct afternoon sun which scorches the tiny leaves. Adaptable to a range of light conditions.",water:"Keep soil consistently moist but not waterlogged. Water when the top half-inch of soil feels dry, typically every 5–7 days. Reduce slightly in winter. Avoid both drought and waterlogging.",temp:"Prefers 50–75°F (10–24°C). Fairly cold-hardy; tolerates brief frost. Protect from hard freezes in containers. Requires a cool dormancy period for best health. Good air circulation is important.",soil:"Use a well-draining bonsai mix with added perlite. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Stop in fall and winter.",rep:"Repot every 2–3 years in spring. Prune roots lightly. Use fresh, well-draining bonsai mix. This plant tolerates being slightly root-bound.",growth:"A dense, evergreen shrub with tiny, dark green leaves ideal for bonsai. One of the most traditional bonsai species. Growth is slow but steady. Tolerates heavy pruning and can be shaped into formal styles. Excellent for beginners due to its forgiving nature.",problems:["Bronze or brown leaves in winter may indicate cold damage; protect from hard frost","Root rot from overwatering or poor drainage","Boxwood psyllid may cause leaf cupping; treat with insecticidal soap","Slow growth is normal; be patient","Prune in spring and summer to maintain shape"],tox:"Mildly toxic to pets and humans if ingested in large quantities, causing vomiting and diarrhea. Contains steroidal alkaloids. Keep away from pets that may chew leaves.",prop:"Propagate from semi-hardwood cuttings taken in late summer. Take 3–4 inch cuttings, dip in rooting hormone, and plant in moist potting mix. Keep humid. Roots develop slowly in 6–10 weeks."},
{id:415,cn:"Lycium chinense",la:"Goji Berry Bonsai",light:"Requires full sun for at least 6 hours daily. A south-facing window or outdoor location is ideal. More sun produces more fruit. Tolerates partial shade but flowering and fruiting are reduced.",water:"Water when the top inch of soil is dry, typically every 5–7 days during growth. Reduce in winter. Drought-tolerant once established. Avoid waterlogging.",temp:"Extremely cold-hardy; tolerates temperatures from -10°F to 95°F (-23°C to 35°C). Thrives in a wide range of conditions. Protect from extreme heat without adequate moisture.",soil:"Use a well-draining bonsai or all-purpose mix with added perlite and sand. Tolerates poor soil. Ensure the pot has drainage holes. Repot every 2–3 years in spring.",fert:"Feed with a balanced fertilizer monthly during spring and summer. Switch to a high-phosphorus fertilizer in late summer to encourage fruiting. Stop in winter.",rep:"Repot every 2–3 years in spring. Choose a pot 1–2 inches wider. Prune roots lightly. Use fresh, well-draining mix.",growth:"A deciduous shrub grown as a bonsai for its ornamental purple flowers, bright red berries, and graceful, arching branches. Berries are edible and highly nutritious (goji berries). Reaches 1–3 feet as a bonsai. Growth is vigorous; prune regularly to maintain shape.",problems:["Leggy growth indicates insufficient light or lack of pruning","Berries are edible and nutritious; harvest when fully red","Aphids may appear on new growth; treat with insecticidal soap","Prune after fruiting to maintain shape and encourage next year's growth","Tolerates poor soil and neglect; very beginner-friendly"],tox:"Berries are edible and widely consumed as a superfood. Leaves are also edible in some cuisines. Generally non-toxic. Avoid berries treated with pesticides.",prop:"Propagate from softwood or semi-hardwood cuttings taken in spring or summer. Dip in rooting hormone and plant in moist potting mix. Can also be grown from seed (soak overnight before planting). Layering is also effective."},
