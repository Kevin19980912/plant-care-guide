<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Care Guide</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1b4332;--c2:#2d6a4f;--c3:#40916c;--c4:#52b788;--c5:#74c69d;--c6:#95d5b2;--bg:#f0f4f0;--card:#ffffff;--text:#1a1a2e;--text2:#555;--text3:#888;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);--shadow-h:0 4px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);--r:14px;--tr:.25s cubic-bezier(.4,0,.2,1)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(45,106,79,.08)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:64px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--c2);font-size:20px;font-weight:800;letter-spacing:-.5px;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--c4),var(--c2));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;height:42px;border:2px solid #e8ede8;border-radius:42px;padding:0 42px 0 18px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:var(--tr)}
.search-wrap input:focus{border-color:var(--c4);box-shadow:0 0 0 4px rgba(82,183,136,.12)}
.search-wrap input::placeholder{color:#bbb}
.search-wrap .s-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.plant-count{font-size:13px;color:var(--text3);white-space:nowrap;flex-shrink:0;font-weight:500}
.hero{max-width:1200px;margin:0 auto;padding:40px 24px 20px;text-align:center}
.hero h1{font-size:32px;font-weight:800;color:var(--c1);letter-spacing:-.5px;margin-bottom:8px}
.hero p{font-size:15px;color:var(--text2);max-width:480px;margin:0 auto}
.gallery{max-width:1200px;margin:0 auto;padding:0 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform var(--tr),box-shadow var(--tr);box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.card-img{position:relative;aspect-ratio:1/1;overflow:hidden;background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .card-img img{transform:scale(1.06)}
.id-badge{position:absolute;top:10px;left:10px;background:rgba(27,67,50,.82);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px}
.card-body{padding:14px 16px 16px}
.card-cn{font-size:15px;font-weight:700;line-height:1.4;color:var(--text);margin-bottom:2px}
.card-la{font-size:12px;color:var(--text3);font-style:italic;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no-results{text-align:center;padding:80px 20px;color:var(--text3)}
.no-results .emoji{font-size:48px;margin-bottom:16px}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.active{opacity:1;pointer-events:auto}
.detail-panel{background:#fff;border-radius:18px;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;position:relative;transform:translateY(20px) scale(.97);transition:transform .35s ease;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.overlay.active .detail-panel{transform:translateY(0) scale(1)}
.detail-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.detail-close:hover{background:rgba(0,0,0,.1)}
.detail-hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:32px 32px 24px;align-items:start}
.detail-img{aspect-ratio:1/1;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-meta{display:flex;flex-direction:column;justify-content:center;gap:8px}
.detail-id{display:inline-block;background:var(--c2);color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:20px;width:fit-content}
.detail-cn{font-size:26px;font-weight:800;line-height:1.3;color:var(--c1)}
.detail-la{font-size:15px;color:var(--text3);font-style:italic}
.detail-sections{padding:0 32px 24px}
.section-card{background:var(--bg);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.section-card .section-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.section-card .section-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.section-card.light .section-icon{background:#fff8e1;color:#f9a825}
.section-card.water .section-icon{background:#e3f2fd;color:#1976d2}
.section-card.temp .section-icon{background:#fce4ec;color:#e53935}
.section-card.soil .section-icon{background:#efebe9;color:#795548}
.section-card.fert .section-icon{background:#e8f5e9;color:#2e7d32}
.section-card.air .section-icon{background:#e0f7fa;color:#00838f}
.section-card.growth .section-icon{background:#f3e5f5;color:#7b1fa2}
.section-card.problems .section-icon{background:#fff3e0;color:#ef6c00}
.section-card.tox .section-icon{background:#fce4ec;color:#c62828}
.section-card.prop .section-icon{background:#e8eaf6;color:#283593}
.section-card.rep .section-icon{background:#e0f2f1;color:#00695c}
.section-card.ship .section-icon{background:#fff8e1;color:#f57f17}
.section-card h3{font-size:15px;font-weight:700;color:var(--text)}
.section-card p{font-size:13.5px;color:var(--text2);line-height:1.65}
.detail-nav{display:flex;justify-content:space-between;padding:16px 32px 24px;border-top:1px solid #eee}
.nav-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--c2);font-size:14px;font-weight:600;padding:8px 16px;border-radius:8px;transition:background .2s;border:none;background:none;cursor:pointer}
.nav-btn:hover{background:rgba(45,106,79,.06)}
.nav-btn.disabled{opacity:.3;pointer-events:none}
.site-footer{text-align:center;padding:24px;color:var(--text3);font-size:12px;border-top:1px solid #e8ede8}
@media(max-width:768px){
  .header-inner{height:auto;padding:12px 16px;flex-wrap:wrap}
  .search-wrap{max-width:100%;order:3;width:100%}
  .hero{padding:28px 16px 12px}
  .hero h1{font-size:24px}
  .gallery{padding:0 16px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .card-body{padding:10px 12px 14px}
  .detail-hero{grid-template-columns:1fr;gap:16px;padding:20px 20px 16px}
  .detail-sections,.detail-nav{padding-left:20px;padding-right:20px}
  .detail-cn{font-size:22px}
  .overlay{padding:10px}
}
@media(max-width:380px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="showGallery();return false">
      <span class="logo-icon">🌿</span>
      <span>Plant Care Guide</span>
    </a>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search by ID or name…" autocomplete="off" oninput="filterPlants()">
      <span class="s-icon">🔍</span>
    </div>
    <div class="plant-count" id="plantCount"></div>
  </div>
</header>

<div class="hero" id="heroSection">
  <h1>Plant Care Guide</h1>
  <p>Find the 3-digit plant ID on the shipping label and enter it to look up care instructions. For example, if the label reads <strong>022 × 1</strong>, enter <strong>022</strong></p>
</div>

<div class="gallery">
  <div class="grid" id="plantGrid"></div>
  <div class="no-results" id="noResults" style="display:none">
    <div class="emoji">🌱</div>
    <p>No matching plants found. Try a different keyword.</p>
  </div>
</div>

<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<footer class="site-footer">© 2026 Plant Care Guide</footer>

<script>
const plants=[
{id:201,cn:"Spathiphyllum wallisii",la:"Peace Lily",light:"Thrives in bright indirect light with no direct sun. A north- or east-facing window is ideal. Tolerates low light but may produce fewer flowers. Too much direct sun scorches the leaves, causing brown tips and bleached patches.",water:"Keep soil consistently moist but never waterlogged. Water when the top inch of soil feels dry, typically every 7–10 days. Drooping leaves are a reliable thirst indicator. Reduce watering in winter when growth slows. Use room-temperature water to avoid root shock.",temp:"Ideal range 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Avoid placing near heaters, air conditioners, or drafty windows. Prefers moderate to high humidity; mist or use a pebble tray if air is dry.",soil:"Use a well-draining, peat-based potting mix. A blend of peat moss, perlite, and standard potting soil works well. Ensure the pot has drainage holes. Repot every 1–2 years or when roots circle the pot.",fert:"Feed with a balanced liquid houseplant fertilizer diluted to half strength every 4–6 weeks during spring and summer. Do not fertilize in fall and winter. Over-fertilizing causes brown leaf tips.",rep:"Repot every 1–2 years in spring when the plant becomes root-bound. Choose a pot only slightly larger than the current one. Use fresh, well-draining potting mix. Wait 5–7 days before watering after repotting.",growth:"A compact, clumping tropical perennial prized for its glossy dark green leaves and elegant white spathe flowers. Blooms can last several months. Growth is moderate; mature plants reach 12–18 inches tall and produce offsets.",problems:["Yellow leaves usually indicate overwatering or poor drainage","Brown leaf tips suggest low humidity, excess fertilizer, or fluoride in water","Wipe leaves regularly to remove dust and maintain photosynthesis","Drooping leaves signal the plant needs water; it recovers quickly after watering","Mealybugs and spider mites can appear in dry conditions; treat with neem oil"],tox:"Mildly toxic to pets and humans if ingested. Contains calcium oxalate crystals that cause mouth irritation and drooling. Keep out of reach of cats, dogs, and small children.",prop:"Easily propagated by division. Separate offsets (pups) from the mother plant during repotting. Each division should have its own root system. Plant in fresh potting mix and keep moist until established."},
{id:202,cn:"Epipremnum aureum",la:"Golden Pothos",light:"Adapts to a wide range of light conditions, from low light to bright indirect light. Thrives best in moderate to bright indirect light, which enhances leaf variegation. Avoid prolonged direct sun which scorches leaves. Tolerates fluorescent office lighting well.",water:"Water thoroughly when the top 1–2 inches of soil are dry, typically every 7–14 days depending on light and temperature. Allow excess water to drain completely. Reduce frequency in winter. Yellow leaves often indicate overwatering; wilting indicates underwatering.",temp:"Prefers 60–85°F (15–29°C). Tolerates brief dips to 50°F (10°C) but sustained cold causes leaf damage. Avoid cold drafts, frost, and sudden temperature swings. Average household temperatures are ideal.",soil:"Use a well-draining, all-purpose potting mix. A blend of potting soil, perlite, and orchid bark provides excellent drainage and aeration. Ensure the pot has drainage holes. Repot when roots emerge from drainage holes or growth stalls.",fert:"Feed with a balanced liquid fertilizer diluted to half strength once a month during the growing season (spring through early fall). Withhold fertilizer in winter. Over-fertilizing causes salt buildup and leaf burn.",rep:"Repot every 1–2 years in spring when root-bound. Choose a pot 1–2 inches wider. Trim any circling or dead roots. Use fresh potting mix and water lightly after repotting. Can also be propagated and replanted in the same pot for a fuller appearance.",growth:"A vigorous trailing vine that can grow 6–10 feet indoors under good conditions. Heart-shaped leaves develop golden-yellow variegation in brighter light. Can be grown in water or soil. Excellent for shelves, hanging baskets, or as a climbing plant on a moss pole.",problems:["Yellow leaves usually indicate overwatering; check soil moisture before watering","Brown crispy leaf edges suggest underwatering or low humidity","Loss of variegation means the plant needs more light","Leggy growth with long gaps between leaves indicates insufficient light","Root rot from soggy soil is the most common cause of death"],tox:"Toxic to pets and humans if ingested. Contains insoluble calcium oxalate crystals causing oral irritation, excessive drooling, and difficulty swallowing. Keep away from curious pets.",prop:"One of the easiest plants to propagate. Take 4–6 inch stem cuttings with at least 2 nodes. Place in water or directly in moist soil. Roots develop within 1–2 weeks. Can also be propagated by layering."},
{id:203,cn:"Monstera deliciosa",la:"Swiss Cheese Plant",light:"Thrives in bright indirect light for 6–8 hours daily. An east- or west-facing window is ideal. Tolerates medium light but growth slows and leaf fenestrations may not develop. Avoid direct midday sun which burns leaves. Rotate the plant quarterly for even growth.",water:"Water thoroughly when the top 2–3 inches of soil are dry, typically every 7–10 days in summer and every 2–3 weeks in winter. Allow excess to drain completely. Never let the pot sit in standing water. Drooping or curling leaves indicate thirst.",temp:"Prefers 65–85°F (18–29°C). Protect from temperatures below 50°F (10°C) and cold drafts. Thrives in moderate to high humidity (40–60%). Mist leaves or use a humidifier in dry environments. Avoid placing near heating vents or air conditioners.",soil:"Use a chunky, well-draining aroid mix: equal parts potting soil, orchid bark, and perlite. Add horticultural charcoal for extra drainage. A pot with drainage holes is essential. Repot every 1–2 years in spring.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 4 weeks during spring and summer. Reduce to every 8 weeks in fall. Stop fertilizing in winter. A slow-release fertilizer can also be applied in spring.",rep:"Repot every 1–2 years when roots emerge from drainage holes or growth slows. Use a pot 2 inches wider with fresh aroid mix. Provide a moss pole or stake for support as the plant matures. Handle aerial roots gently; guide them into the soil or moss pole.",growth:"A fast-growing tropical climber native to Central American rainforests. Mature plants develop large, deeply lobed leaves with characteristic fenestrations (holes). Can reach 6–8 feet indoors with proper support. Aerial roots help the plant climb and absorb moisture.",problems:["Yellow lower leaves may indicate overwatering; check soil drainage","Brown leaf edges with yellow halo suggest underwatering or low humidity","Lack of fenestrations (leaf holes) means the plant needs more light or is too young","Small flies (fungus gnats) indicate consistently wet soil; let soil dry more between waterings","Wipe dusty leaves monthly with a damp cloth to maintain photosynthesis"],tox:"Toxic to pets and humans. Contains calcium oxalate crystals causing mouth pain, drooling, and swelling. Keep away from cats, dogs, and children. Wear gloves when handling cut stems as sap can irritate skin.",prop:"Propagate by stem cuttings with at least one node and an aerial root. Place in water or moist soil. Roots develop in 2–4 weeks. Air layering is also effective for larger specimens. Best done in spring or early summer."},
{id:204,cn:"Sansevieria trifasciata",la:"Snake Plant",light:"Extremely adaptable — thrives in bright indirect light but tolerates very low light and even fluorescent office lighting. Bright light encourages faster growth and stronger variegation. Some gentle morning sun is beneficial. Avoid sudden exposure to harsh midday sun after being in low light.",water:"Use the soak-and-dry method: water thoroughly, then allow soil to dry completely before watering again. Typically every 2–4 weeks in summer, every 6–8 weeks in winter. Overwatering is the number one killer. If in doubt, wait. Wrinkled leaves with dry soil indicate thirst.",temp:"Prefers 60–85°F (16–29°C). Tolerates brief dips to 45°F (7°C) but sustained cold causes damage. Protect from frost. Avoid cold drafts, heaters, and air conditioners blowing directly on the plant.",soil:"Requires a fast-draining cactus or succulent mix. Add extra perlite or pumice for drainage. A terracotta pot with drainage holes is ideal as it dries faster than glazed ceramic. Avoid heavy peat-based soils that retain moisture.",fert:"Feed lightly with a diluted cactus or houseplant fertilizer at quarter to half strength every 4–6 weeks during spring and summer only. Do not fertilize in fall or winter. Over-fertilizing causes weak, soft growth.",rep:"Repot every 2–3 years or when the pot becomes crowded with rhizomes and offsets. Choose a pot only slightly wider. Handle thick leaves gently to avoid cracking. Wait 5–7 days before watering after repotting to let damaged roots heal.",growth:"An upright, architectural succulent prized for its sword-shaped, variegated leaves. Growth is slow to moderate. Mature plants produce underground rhizomes that send up new shoots and occasional flower stalks. Excellent air purifier that releases oxygen at night.",problems:["Soft, yellow, mushy leaves with wet soil indicate root rot — stop watering immediately and repot","Wrinkled leaves with completely dry soil mean the plant needs water","Brown leaf tips may result from inconsistent watering, fluoride in water, or salt buildup","Slow growth is normal, especially in low light","Older outer leaves naturally yellow and die; remove only when completely dry"],tox:"Mildly toxic to pets if ingested. Contains saponins causing nausea, vomiting, and diarrhea. Keep away from cats and dogs that may chew the leaves.",prop:"Easily propagated by division of offsets or rhizome division during repotting. Leaf cuttings in water or soil also work, though variegated varieties may lose their patterns. Cut a healthy leaf into 2–3 inch sections, let callus for 2 days, then plant in moist cactus mix."},
{id:205,cn:"Chlorophytum comosum",la:"Spider Plant",light:"Prefers bright indirect light but adapts to partial shade and low light. An east- or north-facing window works well. Direct afternoon sun can scorch leaf tips. Variegated varieties need moderate light to maintain their white or cream stripes.",water:"Keep soil evenly moist during the growing season (spring–fall). Water when the top inch of soil feels dry, typically every 7–10 days. Reduce frequency in winter. Use distilled or rainwater if possible; fluoride in tap water causes brown leaf tips.",temp:"Prefers 60–75°F (15–24°C). Tolerates brief dips to 45°F (7°C). Protect from frost and cold drafts. Average household humidity is sufficient; mist occasionally in very dry environments.",soil:"Use a well-draining, all-purpose potting mix with added perlite for aeration. Ensure the pot has drainage holes. Repot every 1–2 years when the plant becomes root-bound or produces many offsets.",fert:"Feed with a balanced liquid fertilizer diluted to half strength once a month during spring and summer. Withhold in fall and winter. Over-fertilizing causes brown leaf tips and reduces plantlet production.",rep:"Repot every 1–2 years in spring when the thick, tuberous roots fill the pot. Choose a pot 1–2 inches wider. Divide the root ball if the plant is too large. Use fresh potting mix and water lightly after repotting.",growth:"A fast-growing, cascading perennial known for its arching leaves and trailing stems that produce baby plantlets (spiderettes). Mature plants reach 12–18 inches tall and 24 inches wide. Excellent in hanging baskets or on high shelves. Recognized by NASA as an effective air purifier.",problems:["Brown leaf tips are commonly caused by fluoride in tap water, over-fertilizing, or low humidity","Pale or faded leaves indicate too much direct sun or nutrient deficiency","Remove spiderettes to redirect energy to the mother plant or leave them for a fuller display","Root rot from waterlogged soil is the most common cause of death","Mealybugs may appear in leaf crevices; treat with rubbing alcohol or neem oil"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets. One of the few houseplants considered completely pet-safe.",prop:"Extremely easy to propagate. Cut off spiderettes (baby plantlets) from the mother plant and place them in water or directly in moist soil. Roots develop within 1–2 weeks. Can also be propagated by division of the root ball."},
{id:206,cn:"Aloe vera",la:"Aloe Vera",light:"Requires bright, indirect light for at least 6 hours daily. A south- or west-facing window is ideal indoors. Acclimate gradually to stronger light after shipping or repotting to prevent sunburn. Too little light causes leggy, stretched growth and pale coloring.",water:"Water deeply using the soak-and-dry method: water thoroughly until it drains from the bottom, then wait until the soil is completely dry before watering again. Typically every 2–3 weeks in summer, every 4–6 weeks in winter. Overwatering causes mushy, translucent leaves and root rot.",temp:"Prefers 65–85°F (18–29°C). Protect from temperatures below 40°F (4°C) and frost. Tolerates heat well with adequate airflow. Avoid cold drafts and sudden temperature changes. Bring indoors before the first frost if grown outside.",soil:"Requires a fast-draining cactus or succulent mix with added perlite, pumice, or coarse sand. A terracotta pot with drainage holes is essential. Avoid heavy, moisture-retaining soils. Repot every 2–3 years or when offsets fill the container.",fert:"Feed lightly with a diluted succulent fertilizer (quarter strength) once in spring and once in summer. Do not fertilize in fall or winter. Over-fertilizing causes weak, unnatural growth. Fresh potting mix usually provides sufficient nutrients.",rep:"Repot every 2–3 years when the plant outgrows its pot or offsets crowd the container. Choose a pot only slightly wider. Use fresh cactus mix and wait 5–7 days before watering to allow damaged roots to callus over.",growth:"A rosette-forming succulent with thick, fleshy, lance-shaped leaves. Mature plants produce offsets (pups) at the base. Gel inside the leaves has been used traditionally for soothing minor skin irritations and burns. Growth is moderate; plants reach 12–24 inches tall.",problems:["Mushy, translucent leaves indicate overwatering — stop watering and check for root rot","Brown, crispy leaf tips are normal aging; outer leaves naturally dry and shrivel","Reddish or brown coloring indicates sun stress, which is usually harmless","Stretching or elongated growth means the plant needs more light","White spots may be natural variegation or scale insects; inspect closely"],tox:"The gel inside leaves is generally safe for topical use, but the latex (yellow sap just under the skin) is toxic if ingested, causing stomach cramps and diarrhea. Keep away from pets that may chew the leaves.",prop:"Propagate by removing offsets (pups) from the base of the mother plant. Gently separate with some roots attached, let the cut dry for 1–2 days, then plant in dry cactus mix. Wait one week before watering."},
{id:207,cn:"Cactaceae",la:"Cactus (General)",light:"Requires full sun or very bright light for at least 6 hours daily. A south-facing window is ideal indoors. Bright light keeps cacti compact, symmetrical, and encourages flowering. Gradually introduce stronger sunlight after shipping to prevent sunburn. Insufficient light causes etiolation (stretching).",water:"Always use the soak-and-dry method. Water thoroughly until excess drains from the bottom, then allow soil to dry completely. Typical schedule: every 14–28 days in spring/summer, every 4–8 weeks in fall/winter. Some species may need even less. Slight wrinkling with dry soil usually means it needs water.",temp:"Prefers warm, dry conditions at 60–90°F (16–32°C). Protect from frost and temperatures below 40°F (4°C). During extreme heat above 95°F (35°C), provide afternoon shade and increase airflow. Avoid sudden temperature swings and cold drafts.",soil:"Requires a very fast-draining cactus mix containing pumice, perlite, lava rock, coarse sand, or other gritty mineral materials. Avoid peat-based soils that stay wet. Always use a pot with drainage holes. Terracotta pots dry faster and are preferred.",fert:"Feed lightly with a diluted cactus fertilizer at quarter to half strength every 4–6 weeks during spring and summer active growth. Do not fertilize in fall or winter. Avoid over-fertilizing, which causes weak or unnatural growth.",rep:"Repot every 2–3 years when roots become crowded or drainage declines. Choose a pot only slightly larger than the root ball. Use thick gloves or newspaper to handle spiny species. Wait 5–7 days before watering after repotting.",growth:"Extremely diverse group ranging from small globular forms to tall columnar species. Growth is generally slow. Many species produce spectacular flowers when mature and given adequate light and seasonal temperature variation. Most cacti are native to the Americas.",problems:["Stretching or uneven growth means the plant needs more light","Wrinkled body with completely dry soil indicates thirst","Soft, translucent, or black tissue with wet soil indicates overwatering or rot","Brown crispy patches may be sunburn from sudden exposure to intense light","Dry corky areas near the base are normal aging in many species"],tox:"Most cacti are non-toxic, but spines can cause injury. Keep away from pets and small children. Some species produce irritating sap when damaged. Handle with care during repotting.",prop:"Propagation methods vary by species. Many can be propagated from offsets (pups) that form at the base. Allow cut surfaces to callus for several days before planting in dry cactus mix. Some species are grown from seed. Do not water until roots establish."},
{id:208,cn:"Succulent Mix",la:"Mixed Succulents",light:"Requires bright light for at least 4–6 hours daily. A south- or east-facing window is ideal. Gradually acclimate to direct sun after shipping. Too little light causes etiolation (stretching), faded colors, and flattened rosettes. Rotate the pot periodically for even light exposure.",water:"Water only when soil is completely dry using the soak-and-dry method. Water thoroughly until it drains from the bottom, then wait until the soil dries out entirely. In summer, reduce watering for many species to prevent rot. Wrinkled leaves with dry soil usually indicate thirst.",temp:"Prefers 50–85°F (10–29°C) depending on species. Most succulents are not frost-hardy; protect from temperatures below 32°F (0°C). Some hardy varieties tolerate brief frost. Avoid cold drafts and ensure good ventilation in summer heat.",soil:"Use a gritty, fast-draining succulent or cactus mix amended with extra perlite, pumice, or coarse sand. Ensure every pot has drainage holes. Terracotta pots help prevent overwatering by drying faster than glazed or plastic pots.",fert:"Feed with a diluted succulent fertilizer at quarter to half strength once a month during spring and fall growing seasons. Do not fertilize during summer dormancy or winter. Over-fertilizing causes weak, leggy growth.",rep:"Repot every 1–2 years when the plant outgrows its pot or soil becomes compacted. Use fresh succulent mix and a pot only slightly wider. Let cut or damaged roots callus for 2–3 days before planting. Wait 5–7 days before watering.",growth:"Succulents encompass a vast range of forms: rosettes, trailing stems, stacked leaves, and columnar shapes. Growth is generally slow to moderate. Many change color with sun stress, producing vivid reds, purples, and pinks. Ideal for windowsills, terrariums (open only), and container arrangements.",problems:["Stretching (etiolation) indicates insufficient light — move to brighter location","Mushy, translucent leaves mean overwatering; stop watering and check for rot","Brown crispy lower leaves are often normal aging; remove gently","Mealybugs appear as white cottony masses in leaf crevices; treat with alcohol swabs","Different species in a mixed pot may have different water needs; monitor individually"],tox:"Most succulents are non-toxic, but some genera (Euphorbia, Kalanchoe) contain irritating or toxic sap. Research each species individually. Keep away from pets that may chew leaves.",prop:"Many succulents propagate easily from leaf cuttings or offsets. Remove a healthy leaf, let it callus for 2–3 days, place on dry soil, and mist lightly. Offsets can be separated and replanted. Patience is required — rooting takes 2–8 weeks."},
{id:209,cn:"Pilea peperomioides",la:"Chinese Money Plant",light:"Prefers bright indirect light for 4–6 hours daily. An east-facing window is ideal. Leaves are strongly phototropic and will lean toward light; rotate the pot weekly for even growth. Tolerates medium light but growth slows. Avoid harsh direct sun which scorches the round leaves.",water:"Keep soil evenly moist but not waterlogged. Water when the top inch of soil feels dry, typically every 7–10 days. Drooping leaves indicate thirst. Reduce watering in winter. Ensure good drainage; soggy soil causes root rot quickly.",temp:"Prefers 60–75°F (15–24°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is sufficient. Avoid placing near heating vents or air conditioners.",soil:"Use a well-draining, all-purpose potting mix with added perlite for aeration. A pot with drainage holes is essential. Repot every 1–2 years in spring when the plant becomes root-bound.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 2–4 weeks during spring and summer. Reduce to monthly in fall. Stop in winter. Over-fertilizing causes distorted leaf growth.",rep:"Repot every 1–2 years in spring. Choose a pot 1–2 inches wider. Separate offsets (pups) during repotting to reduce crowding or propagate new plants. Use fresh potting mix.",growth:"A compact, upright perennial known for its distinctive round, coin-shaped leaves on long petioles. Reaches 8–12 inches tall. Produces numerous offsets at the base that can be separated. Considered a symbol of prosperity and good fortune in many cultures.",problems:["Leaning or curling leaves indicate the plant needs more light or rotation","Yellow lower leaves may indicate overwatering","White crusty deposits on soil surface indicate salt buildup from hard water or over-fertilizing","Small brown spots on leaves may be edema from inconsistent watering","Dropping leaves can result from cold drafts or sudden environmental changes"],tox:"Non-toxic to cats, dogs, and humans. Considered pet-safe for households with curious animals.",prop:"Very easy to propagate from offsets. Gently separate pups from the mother plant with some roots attached and pot in moist soil. Can also be propagated from stem cuttings placed in water. Best done in spring or early summer."},
{id:210,cn:"Ficus lyrata",la:"Fiddle Leaf Fig",light:"Requires bright indirect to bright filtered light for 6–8 hours daily. An east-facing window with morning sun is ideal. Rotate the plant weekly for even, upright growth. Too little light causes leaf drop and leggy growth. Avoid harsh midday sun through hot glass which scorches leaves.",water:"Water thoroughly when the top 2–3 inches of soil are dry. Allow excess to drain completely; never let the pot sit in water. Typical schedule: every 7–10 days in summer, every 2–3 weeks in winter. Inconsistent watering is the primary cause of leaf drop.",temp:"Prefers 65–80°F (18–27°C). Extremely sensitive to cold drafts, temperature swings, and dry air. Protect from temperatures below 55°F (13°C). Maintain humidity above 40%; use a humidifier or pebble tray if needed. Avoid placement near heaters, AC vents, or drafty doors.",soil:"Use a well-draining, chunky potting mix with added perlite and orchid bark. Ensure excellent drainage with a pot that has multiple holes. Repot every 1–2 years in spring. A layer of mulch on top helps retain even moisture.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 4 weeks during spring and summer. Use a foliage-specific fertilizer for best results. Reduce frequency in fall; stop in winter.",rep:"Repot every 1–2 years in spring when roots circle the pot or drainage slows. Choose a pot 2 inches wider. Use fresh, well-draining mix. The plant may drop some leaves after repotting due to stress; this is temporary.",growth:"A striking tropical tree native to western Africa with large, violin-shaped leaves. Can reach 6–10 feet indoors. Growth is moderate during warm months. Lower leaves naturally drop as the plant matures, creating a tree-like form. Requires patience and consistent care.",problems:["Brown spots with crispy edges indicate underwatering or low humidity","Dark brown or black spots with yellow halo suggest overwatering or root rot","Leaf drop is commonly caused by environmental changes, drafts, or inconsistent watering","Dusty leaves block light; wipe with a damp cloth monthly","Red spots on new leaves are normal and fade as leaves mature"],tox:"Mildly toxic to pets and humans. The milky sap contains ficin which causes oral irritation, drooling, and vomiting if ingested. Sap can also irritate skin; wear gloves when pruning.",prop:"Propagate by stem cuttings with at least 2–3 leaves. Dip the cut end in rooting hormone and place in moist, well-draining soil or water. Air layering is more reliable for larger branches. Best attempted in spring or early summer."},
{id:211,cn:"Dypsis lutescens",la:"Areca Palm",light:"Thrives in bright indirect light for 4–6 hours daily. An east- or west-facing window is ideal. Tolerates some gentle morning sun but avoid harsh afternoon rays which scorch fronds. Too little light causes sparse, weak growth and yellowing.",water:"Keep soil consistently moist but never waterlogged. Water when the top inch of soil feels dry, typically every 7–10 days. Reduce slightly in winter but do not let soil dry out completely. Use room-temperature, filtered water to avoid fluoride damage.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Requires moderate to high humidity (40–60%). Mist fronds regularly or use a humidifier in dry environments. Brown leaf tips indicate dry air.",soil:"Use a well-draining, peat-based potting mix with added perlite or sand. A slightly acidic pH (6.0–6.5) is ideal. Ensure the pot has drainage holes. Repot every 2–3 years when root-bound.",fert:"Feed with a palm-specific or balanced liquid fertilizer diluted to half strength monthly during spring and summer. Palms are sensitive to over-fertilizing; use sparingly. Yellowing fronds may indicate magnesium or potassium deficiency.",rep:"Repot every 2–3 years in spring when roots fill the container. Choose a pot 2 inches wider. Handle the root ball gently. Use fresh, well-draining mix and water lightly after repotting.",growth:"An elegant, clustering palm with arching, feathery fronds that create a lush tropical appearance. Can reach 6–8 feet indoors. Growth is moderate during warm months. Acts as a natural humidifier and air purifier. Requires generous space as it matures.",problems:["Brown leaf tips are usually caused by dry air, fluoride in water, or inconsistent watering","Yellow fronds may indicate overwatering, nutrient deficiency, or natural aging of oldest leaves","Spider mites thrive in dry conditions; increase humidity and treat with neem oil if detected","Scale insects appear as small brown bumps on stems; remove with alcohol swabs","Mealybugs may hide in leaf axils; inspect regularly and treat promptly"],tox:"Non-toxic to cats, dogs, and humans. Considered pet-safe and suitable for households with animals.",prop:"Propagate by seed (slow, 2–4 months to germinate) or by division of mature clumps during repotting. Division is the faster method. Separate a healthy section with roots and pot in fresh mix. Keep warm and moist until established."},
{id:212,cn:"Ficus elastica",la:"Rubber Plant",light:"Prefers bright indirect light for 5–6 hours daily. An east- or west-facing window is ideal. Tolerates some direct morning sun. Variegated varieties need brighter light to maintain color. Too little light causes leaf drop and leggy growth. Rotate quarterly for even form.",water:"Water when the top 2 inches of soil are dry, typically every 7–10 days in summer and every 2–3 weeks in winter. Allow excess to drain completely. Overwatering causes yellow leaves and root rot. Underwatering causes drooping and leaf drop.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Tolerates average household humidity but benefits from occasional misting. Avoid placing near heating vents or air conditioners.",soil:"Use a well-draining, all-purpose potting mix with added perlite. Ensure the pot has drainage holes. Repot every 1–2 years when root-bound. A terracotta pot helps prevent overwatering.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 4 weeks during spring and summer. Reduce to every 8 weeks in fall. Stop in winter. Wipe leaves monthly to remove dust and improve photosynthesis.",rep:"Repot every 1–2 years in spring when roots emerge from drainage holes. Choose a pot 1–2 inches wider. The plant may drop a few leaves after repotting; this is normal stress response. Use fresh potting mix.",growth:"A robust tropical tree with thick, glossy, oval leaves that can grow 4–6 feet indoors. New leaves emerge in a colorful sheath that falls away as the leaf unfurls. Growth is moderate to fast in bright light. Can be pruned to control height and encourage branching.",problems:["Yellow lower leaves may indicate overwatering","Dropping leaves often result from environmental changes, cold drafts, or inconsistent watering","White milky sap is mildly irritating; wear gloves when pruning","Brown leaf edges suggest underwatering, low humidity, or salt buildup from hard water","Mealybugs and scale may appear; treat with neem oil or insecticidal soap"],tox:"Mildly toxic to pets and humans. The milky latex sap causes skin irritation and oral irritation if ingested. Wear gloves when pruning or handling cut stems. Keep away from curious pets.",prop:"Propagate by stem cuttings with at least 2–3 leaves. Air layering is the most reliable method: make a small cut on a healthy stem, wrap with moist sphagnum moss, and wait for roots to form (4–8 weeks). Cut below the roots and pot."},
{id:213,cn:"Dracaena sanderiana",la:"Lucky Bamboo",light:"Prefers bright indirect light but tolerates low light well. Avoid direct sun which scorches leaves and causes yellowing. A north- or east-facing window is ideal. Fluorescent office lighting is acceptable. Too much light causes leaf bleaching.",water:"For hydroponic (water) culture: change water every 7–10 days using filtered, distilled, or dechlorinated water. For soil culture: keep soil consistently moist but not soggy. Yellow leaves or stems usually indicate poor water quality or chemical sensitivity.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 55°F (13°C) and cold drafts. Average household humidity is sufficient. Avoid placing near heating vents or air conditioners.",soil:"Can be grown in water with pebbles for support or in well-draining potting mix. If in water, ensure the water level covers the roots but not the stem. If in soil, use a rich, well-draining mix and keep evenly moist.",fert:"For hydroponic plants: add 1–2 drops of liquid fertilizer to the water monthly. For soil-grown plants: feed with diluted liquid fertilizer every 4–6 weeks during spring and summer. Over-fertilizing causes leaf yellowing.",rep:"For water culture: clean the container and change water regularly. For soil culture: repot every 1–2 years when roots fill the pot. Choose a container 1–2 inches wider. Rinse roots gently when changing water.",growth:"An elegant, versatile plant often grown in water with decorative pebbles. Can reach 2–3 feet tall. Stems can be trained into spirals or braids. Symbolizes good fortune and prosperity in many Asian cultures. Not a true bamboo despite the common name.",problems:["Yellow leaves usually indicate poor water quality, over-fertilizing, or too much direct sun","Brown leaf tips suggest fluoride or chlorine in water; use filtered or distilled water","Algae growth in water containers is normal; clean the container and change water regularly","Soft or mushy stems indicate rot from waterlogged conditions","Slow growth is normal in low light conditions"],tox:"Mildly toxic to cats and dogs if ingested, causing vomiting and drooling. Generally safe for humans. Keep out of reach of pets that may chew the leaves.",prop:"Propagate by cutting a healthy stem into 4–6 inch sections with at least one node. Place in water until roots develop (2–4 weeks). Can also be propagated by division of established clumps. Best done in spring."},
{id:214,cn:"Asparagus setaceus",la:"Asparagus Fern",light:"Prefers bright indirect light or dappled shade. An east- or north-facing window is ideal. Tolerates some morning sun but avoid harsh afternoon rays which scorch the delicate fronds. Too little light causes sparse, leggy growth.",water:"Keep soil consistently moist during the growing season. Water when the top half-inch of soil feels dry, typically every 5–7 days. Reduce slightly in winter but do not let soil dry out completely. Mist frequently to maintain humidity.",temp:"Prefers 60–75°F (15–24°C). Protect from temperatures below 50°F (10°C) and cold drafts. Requires moderate to high humidity. Ideal for bathrooms or kitchens. Avoid smoke, dry air, and heating vents.",soil:"Use a rich, well-draining potting mix with added perlite. A peat-based mix retains moisture well. Ensure the pot has drainage holes. Repot every 1–2 years when roots become crowded.",fert:"Feed with a balanced liquid fertilizer diluted to half strength every 4 weeks during spring and summer. Reduce to every 8 weeks in fall. Stop in winter. Over-fertilizing causes yellowing of fronds.",rep:"Repot every 1–2 years in spring when the thick, tuberous roots fill the pot. Choose a pot 1–2 inches wider. Divide the root ball if the plant is too large. Use fresh potting mix.",growth:"A delicate, feathery perennial (not a true fern) with fine, needle-like cladodes that create a soft, cloud-like appearance. Can reach 2–3 feet wide. Produces small white flowers and red berries on mature plants. Excellent for studies, living rooms, or as a trailing accent.",problems:["Yellowing fronds may indicate underwatering, low humidity, or too much direct sun","Brown, crispy fronds result from dry air or inconsistent watering","Leaf drop is commonly caused by environmental changes or dry conditions","Spider mites thrive in dry air; increase humidity and inspect regularly","The plant has small thorns on mature stems; handle with care"],tox:"Mildly toxic to pets and humans. Berries are particularly toxic if ingested, causing stomach upset. Sap may cause skin irritation in sensitive individuals. Keep away from pets and small children.",prop:"Propagate by division of the tuberous root ball during repotting. Separate into sections with roots and shoots. Can also be grown from seed (soak seeds overnight before planting). Best divided in spring."},
{id:215,cn:"Adiantum raddianum",la:"Maidenhair Fern",light:"Prefers bright indirect light or partial shade. An east- or north-facing window is ideal. Avoid all direct sun which quickly scorches the delicate fronds. Tolerates lower light but growth slows significantly.",water:"Keep soil consistently moist at all times; never let it dry out completely. Water every 3–5 days depending on conditions. Use room-temperature, filtered water. Mist daily to maintain high humidity. A bathroom or kitchen window is ideal.",temp:"Prefers 60–72°F (15–22°C). Extremely sensitive to heat, cold, and dry air. Protect from temperatures below 50°F (10°C) and above 80°F (27°C). Requires consistently high humidity (50%+). A humidifier or pebble tray is often necessary.",soil:"Use a rich, moisture-retentive potting mix with peat moss and perlite. Ensure good drainage while maintaining moisture. A pot with drainage holes is essential. Repot every 1–2 years in spring.",fert:"Feed with a diluted fern-specific or balanced liquid fertilizer at quarter strength every 4–6 weeks during spring and summer. Over-fertilizing damages the delicate roots. Flush soil monthly to prevent salt buildup.",rep:"Repot every 1–2 years in spring when the plant becomes crowded. Choose a pot 1 inch wider. Handle fronds and roots very gently. Use fresh, moisture-retentive mix and water immediately after repotting.",growth:"A graceful, delicate fern with fan-shaped pinnae on wiry black stems. One of the most beautiful but demanding ferns. Growth is slow to moderate. Requires consistently high humidity and even moisture. Brown, crispy fronds can be cut to the base to encourage new growth.",problems:["Crispy, brown fronds almost always indicate low humidity or dry soil","Sudden leaf drop may result from drafts, temperature changes, or dry conditions","Yellowing fronds may indicate overwatering or poor drainage","Scale insects may appear as small bumps on stems; remove with alcohol","Recovery from neglect is slow; cut all dead fronds and maintain moisture and humidity"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets and children.",prop:"Propagate by division of the rhizome during repotting. Carefully separate sections with roots and fronds. Keep divisions warm, moist, and in high humidity until established. Spore propagation is possible but very slow."},
{id:216,cn:"Nephrolepis exaltata",la:"Boston Fern",light:"Prefers bright indirect light. An east- or north-facing window is ideal. Tolerates some gentle morning sun. Avoid direct afternoon sun which scorches fronds. Too little light causes sparse growth and frond drop.",water:"Keep soil consistently moist but not waterlogged. Water when the top half-inch of soil feels dry, typically every 5–7 days. Mist fronds frequently to maintain humidity. Never let soil dry out completely; the fern does not recover well from severe drought.",temp:"Prefers 60–75°F (16–24°C). Protect from temperatures below 50°F (10°C) and cold drafts. Requires moderate to high humidity (40–60%). Ideal for bathrooms, kitchens, or rooms with a humidifier.",soil:"Use a rich, peat-based potting mix with added perlite for drainage. Ensure the pot has drainage holes. Repot every 1–2 years when roots fill the pot. A hanging pot with a saucer works well.",fert:"Feed with a balanced liquid fertilizer diluted to quarter to half strength every 4 weeks during spring and summer. Reduce to every 8 weeks in fall. Stop in winter. Over-fertilizing causes brown frond tips.",rep:"Repot every 1–2 years in spring when roots become crowded. Choose a pot 1–2 inches wider. Divide the root ball if the plant is too large. Use fresh, peat-based mix and water thoroughly after repotting.",growth:"A lush, arching fern with gracefully cascading fronds that can reach 2–3 feet long. One of the most popular indoor ferns and a natural air humidifier. Excellent in hanging baskets or on pedestals. Growth is moderate during warm months.",problems:["Brown frond tips usually indicate low humidity or inconsistent watering","Yellowing fronds may indicate overwatering or poor drainage","Frond drop is commonly caused by dry air or underwatering","Remove dead fronds at the base to maintain air circulation and appearance","Scale and mealybugs may hide in frond crevices; inspect and treat with neem oil"],tox:"Non-toxic to cats, dogs, and humans. One of the safest ferns for households with pets.",prop:"Propagate by division of the root ball during repotting. Separate into sections with healthy roots and fronds. Can also be propagated from runners (stolons) that develop plantlets. Keep divisions warm and humid."},
{id:217,cn:"Chamaedorea elegans",la:"Parlor Palm",light:"Tolerates shade well; bright indirect light is sufficient. An east- or north-facing window is ideal. Avoid direct sun which scorches the delicate fronds. One of the most shade-tolerant palms available for indoor use.",water:"Keep soil consistently moist but not waterlogged. Water when the top inch of soil feels dry, typically every 7–10 days. Reduce slightly in winter. Yellow fronds indicate overwatering; brown tips indicate dry air or underwatering.",temp:"Prefers 65–80°F (18–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is acceptable but benefits from occasional misting. Avoid placing near heating vents.",soil:"Use a well-draining, peat-based potting mix with added perlite. Ensure the pot has drainage holes. Repot every 2–3 years when root-bound. Prefers to be slightly root-bound.",fert:"Feed with a palm-specific or balanced liquid fertilizer diluted to half strength monthly during spring and summer only. Do not fertilize in fall or winter. Over-fertilizing causes brown leaf tips.",rep:"Repot every 2–3 years in spring when roots fill the container. Choose a pot only slightly wider. This palm prefers being slightly root-bound. Handle roots gently and use fresh potting mix.",growth:"A compact, slow-growing palm that reaches 2–4 feet indoors. Single-stemmed with graceful, arching fronds. Often sold as multiple seedlings in one pot for a fuller appearance. One of the best palms for desktop or shelf placement. Growth is very slow but the plant is long-lived.",problems:["Brown leaf tips usually indicate dry air or inconsistent watering","Yellow fronds may indicate overwatering or natural aging of oldest leaves","Spider mites thrive in dry conditions; mist regularly and inspect fronds","Slow growth is completely normal for this species","Brown spots on leaves may indicate cold damage or fluoride sensitivity"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate by seed only, which is slow and difficult indoors. Division of multi-stemmed plants during repotting is possible but risky. Generally considered difficult to propagate at home; purchasing a new plant is more practical."},
{id:218,cn:"Hedera helix",la:"English Ivy",light:"Prefers bright indirect light but tolerates partial shade. Variegated varieties need more light to maintain their color patterns. Avoid harsh direct afternoon sun. A north- or east-facing window works well.",water:"Water when the top inch of soil is dry, typically every 7–10 days. Allow excess to drain completely. Reduce in winter. Overwatering causes root rot; underwatering causes crispy leaf edges. Keep soil slightly moist during the growing season.",temp:"Prefers 50–70°F (10–21°C). One of the most cold-hardy houseplants; tolerates temperatures down to 20°F (-7°C) briefly. Prefers cooler conditions. Avoid hot, dry environments and heating vents.",soil:"Use a well-draining, all-purpose potting mix. Ensure the pot has drainage holes. Repot every 1–2 years when root-bound. Can be grown in hanging baskets or trained on a trellis or moss pole.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Reduce in fall; stop in winter. Over-fertilizing causes excessive, weak growth.",rep:"Repot every 1–2 years in spring. Choose a pot 1–2 inches wider. Trim long, leggy vines before repotting. Use fresh potting mix and water lightly.",growth:"A vigorous, versatile climbing or trailing vine that can grow 6–8 feet or more indoors. Can be trained on trellises, topiary forms, or allowed to cascade from hanging baskets. Excellent air purifier recognized by NASA. Growth is fast in favorable conditions.",problems:["Dry, crispy leaf edges indicate underwatering or low humidity","Yellow leaves may indicate overwatering or poor drainage","Spider mites are the most common pest; inspect leaf undersides regularly","Leggy growth with large gaps between leaves indicates insufficient light","Can be invasive outdoors; never plant in the ground in temperate regions"],tox:"Toxic to pets and humans if ingested. Contains hederagenin causing vomiting, abdominal pain, and hypersalivation. Sap may cause contact dermatitis in sensitive individuals. Keep away from pets and children.",prop:"Very easy to propagate from stem cuttings. Take 4–6 inch cuttings with several nodes. Place in water or moist soil. Roots develop in 2–3 weeks. Layering (pinning a stem to soil) is also very effective."},
{id:219,cn:"Peperomia obtusifolia",la:"Baby Rubber Plant",light:"Prefers bright indirect light but tolerates partial shade. An east- or north-facing window is ideal. Avoid direct afternoon sun which can scorch the thick leaves. Variegated varieties need brighter light to maintain color.",water:"Water when the top 1–2 inches of soil are dry, typically every 10–14 days. As a semi-succulent, it stores water in its thick leaves and is prone to root rot if kept soggy. Allow excess to drain completely. Reduce frequency in winter.",temp:"Prefers 60–80°F (15–27°C). Protect from temperatures below 50°F (10°C) and cold drafts. Average household humidity is sufficient. Avoid placing near heating vents or air conditioners.",soil:"Use a well-draining potting mix with added perlite or orchid bark. A cactus/succulent mix amended with potting soil also works well. Ensure the pot has drainage holes. Repot every 2–3 years.",fert:"Feed with a balanced liquid fertilizer diluted to half strength once a month during spring and summer. Do not fertilize in fall or winter. Over-fertilizing causes distorted growth.",rep:"Repot every 2–3 years in spring when the plant outgrows its pot. Choose a pot only slightly wider. This plant prefers being slightly root-bound. Use fresh, well-draining mix.",growth:"A compact, bushy perennial with thick, glossy, spoon-shaped leaves. Reaches 8–12 inches tall and wide. Growth is slow to moderate. An excellent beginner plant due to its tolerance of occasional neglect. The waxy leaves rarely need dusting.",problems:["Soft or mushy leaves indicate overwatering","Wrinkled or shriveled leaves mean the plant needs water","Leaf drop may result from cold drafts or sudden environmental changes","Stem rot from soggy soil is the most common cause of death","Mealybugs may appear in leaf axils; treat with alcohol swabs or neem oil"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem or leaf cuttings. Take a 3–4 inch stem cutting with at least 2 leaves. Let the cut end callus for a day, then plant in moist, well-draining soil. Keep warm and lightly moist. Roots develop in 3–4 weeks."},
{id:220,cn:"Anthurium andraeanum",la:"Anthurium",light:"Prefers bright indirect light for 4–6 hours daily. An east-facing window is ideal. Tolerates medium light but produces fewer flowers. Avoid direct sun which scorches leaves and fades the colorful spathes.",water:"Keep soil consistently moist but not waterlogged. Water when the top inch of soil feels dry, typically every 5–7 days. Use room-temperature water and allow excess to drain. Reduce frequency in winter. Wilting indicates thirst.",temp:"Prefers 70–85°F (21–29°C). Protect from temperatures below 60°F (16°C) and cold drafts. Requires high humidity (60–80%); mist daily or use a humidifier. A bathroom or kitchen with bright light is ideal.",soil:"Use a chunky, well-draining aroid mix: orchid bark, perlite, and peat moss in equal parts. Excellent drainage and aeration are critical. Repot every 1–2 years in spring.",fert:"Feed with a phosphorus-rich flowering fertilizer diluted to quarter strength every 2–4 weeks during the growing season. Reduce in winter. Over-fertilizing causes brown leaf edges and reduces flowering.",rep:"Repot every 1–2 years in spring when aerial roots become prominent or the plant outgrows its pot. Use fresh aroid mix. Bury aerial roots slightly in the new mix. Water lightly after repotting.",growth:"A tropical perennial prized for its glossy, heart-shaped leaves and long-lasting, brightly colored spathes (modified leaves, not true flowers). Can bloom year-round under ideal conditions. Each spathe lasts 6–8 weeks. Growth is moderate.",problems:["Yellow leaves may indicate overwatering or poor drainage","Brown leaf edges suggest low humidity, over-fertilizing, or salt buildup","Green spathes indicate the plant needs more light","Fading spathe color is normal as the bloom ages","Spider mites and mealybugs may appear; treat with neem oil or insecticidal soap"],tox:"Toxic to pets and humans. Contains calcium oxalate crystals causing intense mouth pain, drooling, and swelling. Keep well out of reach of cats, dogs, and children. Wear gloves when handling cut stems.",prop:"Propagate by division of offsets during repotting. Separate healthy sections with roots and aerial roots. Can also be propagated from stem cuttings with at least one node and aerial root. Best done in spring."},
{id:221,cn:"Phalaenopsis",la:"Moth Orchid",light:"Prefers bright indirect light for 6–8 hours daily. An east-facing window is ideal. Leaf color indicates light levels: bright grass-green means ideal light; dark green means too little; reddish-green means too much. Avoid direct midday sun.",water:"Water thoroughly when the potting medium is nearly dry, typically every 7–10 days. Water in the morning so leaves dry by evening. Avoid getting water in the crown (center of the plant); crown rot is fatal. Use room-temperature water.",temp:"Prefers 65–80°F (18–27°C) during the day, with a 10–15°F drop at night to trigger blooming. Protect from temperatures below 55°F (13°C). Requires moderate humidity (40–60%). Avoid cold drafts and heating vents.",soil:"Grow in a specialized orchid bark or sphagnum moss mix. Never use regular potting soil; it suffocates orchid roots. Use a pot with drainage holes or a clear orchid pot to monitor root health. Repot every 1–2 years after flowering.",fert:"Feed with a balanced orchid fertilizer diluted to quarter strength every 2 weeks during the growing season. Use a bloom-booster fertilizer in fall to encourage flowering. Flush the medium with plain water monthly to prevent salt buildup.",rep:"Repot every 1–2 years after flowering finishes, or when the bark medium breaks down. Use fresh orchid bark or sphagnum moss. Trim dead or mushy roots with sterile scissors. Wait 2–3 days before watering after repotting.",growth:"An epiphytic orchid with thick, silvery-green aerial roots and long-lasting flower spikes. Blooms can last 2–3 months. After flowering, cut the spike above the second node to encourage a secondary bloom. Growth is slow; new leaves emerge from the crown once or twice a year.",problems:["Yellow leaves may indicate overwatering or too much direct sun","Wrinkled, leathery leaves suggest underwatering or root loss","Crown rot from water sitting in the center is often fatal; always water carefully","Bud blast (buds dropping before opening) is caused by sudden temperature changes or drafts","After flowering, cut spike above second node to encourage reblooming"],tox:"Non-toxic to cats, dogs, and humans. One of the safest flowering houseplants for households with pets.",prop:"Propagate by keikis (baby plants) that sometimes form on the flower spike. Wait until the keiki has 2–3 roots at least 2 inches long, then cut and pot in orchid bark. Keiki paste (cytokinin) can encourage their formation."},
{id:222,cn:"Kalanchoe blossfeldiana",la:"Flaming Katy",light:"Requires bright, indirect light with some direct morning sun for best flowering. A south- or east-facing window is ideal. At least 4–6 hours of bright light daily. Too little light produces leggy growth and fewer flowers.",water:"Water when the soil is completely dry, typically every 10–14 days. Use the soak-and-dry method. Avoid getting water on the leaves. Reduce watering in winter. Overwatering causes mushy stems and root rot.",temp:"Prefers 60–75°F (15–24°C). Protect from temperatures below 45°F (7°C) and cold drafts. Average household humidity is sufficient. Avoid high humidity which promotes fungal diseases.",soil:"Use a well-draining cactus or succulent mix with added perlite. Ensure the pot has drainage holes. A terracotta pot is ideal. Repot every 1–2 years in spring after flowering.",fert:"Feed with a phosphorus-rich fertilizer diluted to half strength monthly during the growing season to encourage blooming. Stop fertilizing during the short-day period (fall) when buds are forming.",rep:"Repot every 1–2 years in spring after flowering. Choose a pot 1 inch wider. Use fresh cactus mix. Handle the brittle stems carefully during repotting.",growth:"A compact succulent that produces clusters of small, brightly colored flowers (red, pink, orange, yellow, or white). A short-day plant that blooms naturally in fall and winter. Flowers last 4–8 weeks. Reaches 8–12 inches tall. Encourages branching when pruned after flowering.",problems:["Leggy growth with few flowers indicates insufficient light","Mushy stems and leaves indicate overwatering","Failure to rebloom means the plant is not receiving adequate dark periods","Powdery mildew may appear in humid conditions; improve air circulation","Remove spent flowers to encourage new blooms and maintain appearance"],tox:"Toxic to cats, dogs, and birds if ingested. Contains cardiac glycosides causing vomiting, diarrhea, and abnormal heart rhythm in severe cases. Keep away from pets.",prop:"Propagate from stem or leaf cuttings. Take a 3–4 inch cutting, let it callus for 2–3 days, then plant in dry cactus mix. Do not water for the first week. Roots develop in 2–3 weeks. Best propagated in spring or early summer."},
{id:223,cn:"Schlumbergera",la:"Christmas Cactus",light:"Prefers bright indirect light. An east-facing window is ideal. Avoid direct afternoon sun which scorches segments. During the bud-setting period (fall), provide 12–14 hours of darkness daily for 6–8 weeks to trigger blooming.",water:"Keep soil slightly moist during active growth and blooming. Water when the top inch of soil feels dry, typically every 7–10 days. Reduce watering during summer dormancy and after flowering. Never let soil dry out completely during bloom.",temp:"Prefers 60–70°F (15–21°C). Cool night temperatures (55–65°F / 13–18°C) in fall trigger bud formation. Protect from temperatures below 50°F (10°C) and sudden temperature changes which cause bud drop.",soil:"Use a well-draining mix of potting soil, orchid bark, and perlite in equal parts. Slightly acidic pH is preferred. Ensure the pot has drainage holes. Repot every 2–3 years after flowering.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Switch to a high-phosphorus fertilizer in fall to encourage blooming. Stop during winter dormancy.",rep:"Repot every 2–3 years after flowering in late winter or early spring. Choose a pot only slightly wider; this plant prefers being slightly root-bound. Use fresh, well-draining mix.",growth:"An epiphytic cactus native to Brazilian rainforests with flat, segmented stems and spectacular tubular flowers in pink, red, white, or purple. Blooms in late fall to winter (hence the name). Each flower lasts 5–7 days. Can live and bloom for decades with proper care.",problems:["Bud drop is commonly caused by sudden temperature changes, drafts, or inconsistent watering","Limp, wrinkled segments indicate underwatering","Red or purple segments indicate too much direct sun","Failure to bloom means the plant did not receive adequate cool, dark periods in fall","Mealybugs may hide in segment joints; inspect and treat with alcohol swabs"],tox:"Non-toxic to cats, dogs, and humans. Safe for households with pets.",prop:"Propagate from stem segments. Twist off a section of 2–3 segments, let it dry for 1–2 days, then plant the bottom segment in moist cactus mix. Roots develop in 3–4 weeks. Best propagated in spring or early summer."},
{id:224,cn:"Clivia miniata",la:"Kaffir Lily",light:"Prefers bright indirect light. An east- or north-facing window is ideal. Tolerates some morning sun but avoid harsh afternoon rays. During the winter rest period, provide cooler, shadier conditions to trigger blooming.",water:"Water regularly during active growth (spring–fall), keeping soil slightly moist. During the winter rest period (6–8 weeks), reduce watering significantly — only water enough to prevent wilting. Resume regular watering when a flower stalk appears.",temp:"Prefers 60–75°F (15–24°C) during growth. Requires a cool rest period of 45–55°F (7–13°C) for 6–8 weeks in winter to trigger blooming. Protect from frost and temperatures below 40°F (4°C).",soil:"Use a well-draining, rich potting mix with added bark or perlite. Slightly acidic pH is preferred. Ensure the pot has drainage holes. This plant prefers being slightly root-bound; repot every 3–4 years.",fert:"Feed with a balanced liquid fertilizer diluted to half strength monthly during spring and summer. Switch to a high-phosphorus fertilizer in late summer to encourage blooming. Stop fertilizing during the winter rest period.",rep:"Repot every 3–4 years after flowering. This plant thrives when slightly root-bound and resents frequent disturbance. Divide offsets during repotting. Use fresh potting mix and a pot only slightly wider.",growth:"A stately perennial with dark green, strap-like leaves arranged in a symmetrical fan. Produces clusters of trumpet-shaped orange or red flowers on a thick stalk in late winter or early spring. Growth is slow; plants can live for decades. Symmetrical leaf arrangement indicates good care.",problems:["Failure to bloom usually means the plant did not receive an adequate cool rest period","Yellow leaves may indicate overwatering or too much direct sun","Leaf scorch (brown patches) results from direct sun exposure","Mealybugs and scale may hide in leaf bases; inspect regularly","After flowering, leave the stalk until it yellows, then remove gently"],tox:"Toxic to pets and humans if ingested. Contains lycorine alkaloids causing vomiting, diarrhea, and salivation. Keep away from cats, dogs, and children.",prop:"Propagate by division of offsets during repotting. Separate pups with their own roots and pot individually. Seed propagation is possible but takes 4–5 years to bloom. Best divided in spring after flowering."},
{id:225,cn:"Hippeastrum",la:"Amaryllis",light:"Requires bright, indirect light during active growth. A south- or east-facing window is ideal. Rotate the pot regularly to prevent the flower stalk from leaning toward light. After flowering, provide bright light to build bulb strength.",water:"Water sparingly until growth emerges from the bulb, then increase to keep soil evenly moist. Water when the top inch of soil feels dry. Reduce watering after flowering when the plant enters dormancy. Stop watering completely during the dormant period.",temp:"Prefers 65–75°F (18–24°C) during active growth. During dormancy, store the bulb in a cool, dark place at 50–55°F (10–13°C) for 8–10 weeks to trigger reblooming. Protect from frost.",soil:"Use a well-draining, rich potting mix. Plant the bulb with one-third to one-half exposed above the soil surface. Choose a pot only slightly wider than the bulb. Ensure drainage holes.",fert:"Feed with a balanced liquid fertilizer every 2 weeks during active growth. After flowering, continue fertilizing to build bulb energy. Stop fertilizing during dormancy.",rep:"Repot every 2–3 years when the bulb outgrows its pot. Plant with the top third of the bulb exposed. Use fresh potting mix. This plant prefers being slightly root-bound for best flowering.",growth:"A dramatic bulb plant that produces large, showy trumpet-shaped flowers on tall stalks, typically in late winter or spring. Each stalk bears 2–6 flowers. After flowering, strap-like leaves continue growing to store energy in the bulb. Can rebloom annually with proper care.",problems:["Bulb rot from overwatering is the most common cause of failure","Long, floppy leaves indicate insufficient light after flowering","Failure to rebloom means the bulb did not receive an adequate dormancy period","Red blotches on leaves or stems may indicate fungal disease; improve air circulation","Stake the flower stalk if it leans or becomes top-heavy"],tox:"Toxic to pets and humans if ingested. Bulbs contain lycorine alkaloids causing vomiting, diarrhea, abdominal pain, and tremors. Keep away from pets and children.",prop:"Propagate from offsets (small bulbs) that form beside the mother bulb. Separate during repotting and plant individually. Seed propagation is possible but takes 3–5 years to produce a flowering bulb."},
{id:226,cn:"Hyacinthus orientalis",la:"Hyacinth",light:"Requires bright, direct light during growth and flowering. A south-facing window is ideal. After flowering, continue providing bright light to nourish the bulb. If grown outdoors, plant in full sun to partial shade.",water:"Keep soil consistently moist during active growth and flowering. Water when the top half-inch of soil feels dry. For water-grown bulbs, maintain the water level just below the base of the bulb. Reduce watering as foliage dies back naturally.",temp:"Prefers cool conditions at 55–65°F (13–18°C) during flowering for longest bloom duration. Requires a cold period (chilling) of 12–16 weeks at 35–48°F (2–9°C) before growth begins. Protect from heat which shortens bloom time.",soil:"Use a well-draining potting mix or grow in a hyacinth glass with water. For soil culture, plant bulbs 4 inches deep with pointed end up. Ensure excellent drainage. Bulbs can be reused after proper aftercare.",fert:"Feed with a phosphorus-rich fertilizer at half strength every 2 weeks during active growth. Stop fertilizing when foliage begins to yellow and die back naturally.",rep:"After flowering, bulbs can be planted outdoors in fall for spring blooms. In containers, replace with fresh bulbs annually for best results. Allow foliage to die back naturally to nourish the bulb.",growth:"A fragrant spring-blooming bulb with dense spikes of star-shaped flowers in purple, pink, blue, white, or yellow. Each flower spike lasts 2–3 weeks indoors. The fragrance is strong and sweet. Growth is seasonal: chill in winter, bloom in spring, rest in summer.",problems:["Floppy stems may need staking; this is common with indoor-grown hyacinths","Short flower stems indicate insufficient chilling period","Mold on bulbs suggests excess moisture; improve air circulation","The fragrance is very strong; avoid placing in bedrooms if sensitive","Skin irritation may occur when handling bulbs; wear gloves"],tox:"Toxic to pets and humans if ingested. Bulbs contain calcium oxalate and other compounds causing mouth irritation, vomiting, and diarrhea. Handling bulbs may cause skin irritation. Keep away from pets and children.",prop:"Propagate from offsets that form around the mother bulb. Separate and plant in fall. Bulbs can also be forced in water using a hyacinth glass. For best results, use pre-chilled bulbs or chill at 35–48°F (2–9°C) for 12–16 weeks."},
{id:227,cn:"Narcissus tazetta",la:"Narcissus / Paperwhite",light:"Requires bright, direct light during growth and flowering. A south-facing window is ideal. Rotate the container regularly to prevent stems from leaning toward light. After flowering, continue bright light until foliage yellows.",water:"For water culture: maintain water level at the base of the bulbs, changing water every few days. For soil culture: keep soil evenly moist during growth. Reduce watering as foliage dies back naturally after flowering.",temp:"Prefers cool conditions at 50–65°F (10–18°C) for longest bloom duration. Paperwhites do not require a chilling period and can be forced at room temperature. Cooler temperatures extend bloom time and produce shorter, sturdier stems.",soil:"Grow in shallow containers with pebbles and water, or in well-draining potting mix. Plant bulbs close together with tips just above the surface. Use clean, filtered water for water culture.",fert:"No fertilizer is needed for water-grown bulbs; the bulb contains all necessary nutrients. For soil-grown bulbs, feed with a balanced fertilizer at half strength every 2 weeks during growth.",rep:"Paperwhite bulbs are typically discarded or composted after flowering as they rarely rebloom well. Other narcissus varieties can be planted outdoors in fall for spring blooms. Allow foliage to die back naturally.",growth:"A fragrant winter-blooming bulb producing clusters of small white or yellow flowers on tall stems. Paperwhites are the most popular narcissus for indoor forcing. Blooms last 2–3 weeks. Traditional Chinese New Year flower symbolizing prosperity.",problems:["Tall, floppy stems can be controlled with a dilute alcohol solution (4–6%) as the watering liquid","Bulbs are toxic; keep away from pets and children who may be tempted to chew","Strong fragrance may be overwhelming in small rooms","Mold on bulbs in water culture is common; change water regularly and rinse bulbs","After flowering, the bulbs are usually spent and will not rebloom indoors"],tox:"Highly toxic to pets and humans if ingested. All parts contain lycorine causing severe vomiting, diarrhea, abdominal pain, and cardiac arrhythmias. Bulbs are the most toxic part. Keep well away from pets and children.",prop:"Propagate from offsets that form around the mother bulb. Separate and plant in fall. Narcissus bulbs take 3–5 years to reach flowering size from seed. Paperwhites are rarely propagated at home."},
{id:228,cn:"Tulipa",la:"Tulip",light:"Requires full sun or very bright light during growth and flowering. A south-facing window is ideal indoors. After flowering, continue providing bright light until foliage yellows naturally to nourish the bulb.",water:"Keep soil slightly moist during active growth. Water when the top half-inch of soil feels dry. Reduce watering as foliage dies back after flowering. Avoid waterlogging which causes bulb rot.",temp:"Prefers cool conditions at 55–65°F (13–18°C) during flowering. Bulbs require cold stratification: chill at 35–48°F (2–9°C) for 12–16 weeks before growth begins. Warmer temperatures shorten bloom duration.",soil:"Use a well-draining potting mix. Plant bulbs 6–8 inches deep with pointed end up. Ensure excellent drainage. For indoor forcing, plant in shallow pots with tips just above the soil surface.",fert:"Feed with a balanced bulb fertilizer or phosphorus-rich fertilizer at half strength every 2 weeks during active growth. Stop when foliage begins to yellow.",rep:"After flowering, tulip bulbs can be planted outdoors in fall for spring blooms. In containers, replace with fresh bulbs annually for best results. Allow foliage to die back completely before removing.",growth:"Iconic spring-blooming bulbs with cup-shaped flowers in virtually every color. Each flower lasts 1–2 weeks indoors. Growth is seasonal: chill in winter, bloom in spring, rest in summer. Indoor forcing allows winter enjoyment of spring blooms.",problems:["Bulbs must be pre-chilled; unchilled bulbs produce stunted growth or no flowers","Floppy stems may need staking in indoor conditions","Bulb rot from overwatering or poor drainage is the most common failure","Tulips rarely rebloom reliably; treat as seasonal displays","Gray mold (Botrytis) may develop in humid conditions; improve air circulation"],tox:"Toxic to pets and humans if ingested. Bulbs contain tulipalin A and B causing mouth irritation, drooling, vomiting, and diarrhea. Handling bulbs may cause skin irritation in sensitive individuals.",prop:"Propagate from offsets that form around the mother bulb. Separate and plant in fall. Tulip bulbs take several years to reach flowering size from seed. For indoor forcing, purchase pre-chilled bulbs for convenience."},
{id:229,cn:"Lilium",la:"Lily",light:"Requires bright, indirect light to full sun during growth and flowering. A south- or east-facing window is ideal. Rotate the pot regularly for even growth. After flowering, continue bright light until foliage yellows naturally.",water:"Keep soil consistently moist during active growth and flowering. Water when the top inch of soil feels dry. Avoid waterlogging. Reduce watering as foliage dies back after flowering. Never let the soil dry out completely during bloom.",temp:"Prefers 60–70°F (15–21°C) during flowering. Cooler temperatures extend bloom duration. Protect from temperatures below 40°F (4°C) and cold drafts. Average household humidity is sufficient.",soil:"Use a rich, well-draining potting mix with added perlite. Slightly acidic pH is preferred. Plant bulbs with the pointed end up, 4–6 inches deep. Ensure the pot has drainage holes.",fert:"Feed with a balanced liquid fertilizer every 2 weeks during active growth and flowering. Stop fertilizing when foliage begins to yellow after flowering.",rep:"After flowering, lily bulbs can be planted outdoors in fall. In containers, replace with fresh soil and bulbs annually for best results. Allow foliage to die back naturally to nourish the bulb.",growth:"Elegant bulb plants producing large, fragrant, trumpet-shaped flowers in white, pink, orange, yellow, and red. Each flower lasts 1–2 weeks; a single stem may bear multiple blooms. Growth is seasonal. Excellent cut flowers and indoor displays.",problems:["Remove anthers (pollen-bearing tips) immediately as flowers open to prevent staining","Pollen stains are difficult to remove from fabric and surfaces","Aphids may appear on new growth; treat with insecticidal soap","Bulb rot from overwatering is the most common cause of failure","Lilies rarely rebloom indoors; treat as seasonal displays"],tox:"Extremely toxic to cats — even small amounts of pollen, leaves, or flower water can cause fatal kidney failure. Keep lilies completely away from cats. Also mildly toxic to dogs and humans if ingested.",prop:"Propagate from bulb scales or offsets. Separate offsets during repotting and plant individually. Bulb scale propagation involves removing outer scales and planting them in moist medium. Seed propagation takes 3–5 years to flowering."},
