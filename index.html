<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物养护指南</title>
<style>
/* SECTION: reset */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1b4332;--c2:#2d6a4f;--c3:#40916c;--c4:#52b788;--c5:#74c69d;--c6:#95d5b2;--bg:#f0f4f0;--card:#ffffff;--text:#1a1a2e;--text2:#555;--text3:#888;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);--shadow-h:0 4px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);--r:14px;--tr:.25s cubic-bezier(.4,0,.2,1)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

/* SECTION: header */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(45,106,79,.08)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:64px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--c2);font-size:20px;font-weight:800;letter-spacing:-.5px;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--c4),var(--c2));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;height:42px;border:2px solid #e8ede8;border-radius:42px;padding:0 42px 0 18px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:var(--tr)}
.search-wrap input:focus{border-color:var(--c4);box-shadow:0 0 0 4px rgba(82,183,136,.12)}
.search-wrap input::placeholder{color:#bbb}
.search-wrap .s-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.plant-count{font-size:13px;color:var(--text3);white-space:nowrap;flex-shrink:0;font-weight:500}

/* SECTION: hero */
.hero{max-width:1200px;margin:0 auto;padding:40px 24px 20px;text-align:center}
.hero h1{font-size:32px;font-weight:800;color:var(--c1);letter-spacing:-.5px;margin-bottom:8px}
.hero p{font-size:15px;color:var(--text2);max-width:480px;margin:0 auto}

/* SECTION: grid */
.gallery{max-width:1200px;margin:0 auto;padding:0 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform var(--tr),box-shadow var(--tr);box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.card-img{position:relative;aspect-ratio:1/1;overflow:hidden;background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .card-img img{transform:scale(1.06)}
.id-badge{position:absolute;top:10px;left:10px;background:rgba(27,67,50,.82);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px}
.card-body{padding:14px 16px 16px}
.card-cn{font-size:15px;font-weight:700;line-height:1.4;color:var(--text);margin-bottom:2px}
.card-la{font-size:12px;color:var(--text3);font-style:italic;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* SECTION: empty */
.no-results{text-align:center;padding:80px 20px;color:var(--text3)}
.no-results .emoji{font-size:48px;margin-bottom:16px}

/* SECTION: detail overlay */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.active{opacity:1;pointer-events:auto}
.detail-panel{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;position:relative;transform:translateY(20px) scale(.97);transition:transform .35s ease;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.overlay.active .detail-panel{transform:translateY(0) scale(1)}
.detail-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.detail-close:hover{background:rgba(0,0,0,.1)}
.detail-hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:32px 32px 24px;align-items:start}
.detail-img{aspect-ratio:1/1;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-meta{display:flex;flex-direction:column;justify-content:center;gap:8px}
.detail-id{display:inline-block;background:var(--c2);color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:20px;width:fit-content}
.detail-cn{font-size:28px;font-weight:800;line-height:1.3;color:var(--c1)}
.detail-la{font-size:15px;color:var(--text3);font-style:italic}
.detail-care{padding:0 32px 24px}
.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.care-card{background:var(--bg);border-radius:12px;padding:16px}
.care-card .care-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.care-card.light .care-icon{background:#fff8e1;color:#f9a825}
.care-card.water .care-icon{background:#e3f2fd;color:#1976d2}
.care-card.temp .care-icon{background:#fce4ec;color:#e53935}
.care-card.fert .care-icon{background:#e8f5e9;color:#2e7d32}
.care-card h3{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--text)}
.care-card p{font-size:13px;color:var(--text2);line-height:1.5}
.detail-tips{padding:0 32px 28px}
.detail-tips h3{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
.detail-tips ul{list-style:none;padding:0}
.detail-tips li{position:relative;padding-left:22px;margin-bottom:8px;font-size:13px;color:var(--text2);line-height:1.6}
.detail-tips li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--c5)}
.detail-nav{display:flex;justify-content:space-between;padding:16px 32px 24px;border-top:1px solid #eee}
.nav-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--c2);font-size:14px;font-weight:600;padding:8px 16px;border-radius:8px;transition:background .2s;border:none;background:none;cursor:pointer}
.nav-btn:hover{background:rgba(45,106,79,.06)}
.nav-btn.disabled{opacity:.3;pointer-events:none}

/* SECTION: footer */
.site-footer{text-align:center;padding:24px;color:var(--text3);font-size:12px;border-top:1px solid #e8ede8}

/* SECTION: responsive */
@media(max-width:768px){
  .header-inner{height:auto;padding:12px 16px;flex-wrap:wrap}
  .search-wrap{max-width:100%;order:3;width:100%}
  .hero{padding:28px 16px 12px}
  .hero h1{font-size:24px}
  .gallery{padding:0 16px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .card-body{padding:10px 12px 14px}
  .detail-hero{grid-template-columns:1fr;gap:16px;padding:20px 20px 16px}
  .detail-care,.detail-tips,.detail-nav{padding-left:20px;padding-right:20px}
  .care-grid{grid-template-columns:1fr}
  .detail-cn{font-size:24px}
  .overlay{padding:10px}
}
@media(max-width:380px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>

<!-- SECTION: header -->
<header class="site-header">

<!-- SECTION: hero -->

</div>

<!-- SECTION: gallery -->
<div class="gallery">

  </div>
</div>

<!-- SECTION: detail overlay -->
<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">

</div>

<!-- SECTION: footer -->
<footer class="site-footer">© 2026 植物养护指南 · Plant Care Guide</footer>

/* SECTION: render */
const grid=document.getElementById("plantGrid");
const noResults=document.getElementById("noResults");
const countEl=document.getElementById("plantCount");
const overlay=document.getElementById("detailOverlay");
const panel=document.getElementById("detailPanel");
const searchInput=document.getElementById("searchInput");
let currentIdx=-1;

function renderGrid(list){
  if(!list.length){grid.innerHTML="";noResults.style.display="block";countEl.textContent="共 0 种植物";return}
  noResults.style.display="none";
  countEl.textContent=`共 ${list.length} 种植物`;
  grid.innerHTML=list.map((p,i)=>{
    const globalIdx=plants.findIndex(x=>x.id===p.id);
    return `<a class="card" onclick="openDetail(${globalIdx})" data-primary-action="${i===0?'true':'false'}">
      <div class="card-img">
        <img src="images/${p.id}.png" alt="${p.cn}" loading="lazy" onerror="this.style.display='none'">
        <span class="id-badge">#${String(p.id).padStart(3,"0")}</span>
      </div>
      <div class="card-body">
        <div class="card-cn">${p.cn}</div>
        <div class="card-la">${p.la}</div>
      </div>
    </a>`}).join("");
}

function filterPlants(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){renderGrid(plants);return}
  const filtered=plants.filter(p=>{
    const idStr=String(p.id).padStart(3,"0");
    return idStr.includes(q)||p.cn.toLowerCase().includes(q)||p.la.toLowerCase().includes(q)||p.id===parseInt(q)
  });
  renderGrid(filtered);
}

/* SECTION: detail */
function openDetail(idx){
  currentIdx=idx;
  const p=plants[idx];
  const prev=idx>0?idx-1:-1;
  const next=idx<plants.length-1?idx+1:-1;
  panel.innerHTML=`
    <button class="detail-close" onclick="closeDetail()" aria-label="关闭">✕</button>
    <div class="detail-hero">
      <div class="detail-img">
        <img src="images/${p.id}.png" alt="${p.cn}" onerror="this.style.display='none'">
      </div>
      <div class="detail-meta">
        <span class="detail-id">#${String(p.id).padStart(3,"0")}</span>
        <div class="detail-cn">${p.cn}</div>
        <div class="detail-la">${p.la}</div>
      </div>
    </div>
    <div class="detail-care">
      <div class="care-grid">
        <div class="care-card light">
          <div class="care-icon">☀️</div>
          <h3>光照</h3>
          <p>${p.light}</p>
        </div>
        <div class="care-card water">
          <div class="care-icon">💧</div>
          <h3>浇水</h3>
          <p>${p.water}</p>
        </div>
        <div class="care-card temp">
          <div class="care-icon">🌡️</div>
          <h3>温度</h3>
          <p>${p.temp}</p>
        </div>
        <div class="care-card fert">
          <div class="care-icon">🌱</div>
          <h3>施肥</h3>
          <p>${p.fert}</p>
        </div>
      </div>
    </div>
    <div class="detail-tips">
      <h3>💡 注意事项</h3>
      <ul>${p.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
    </div>
    <div class="detail-nav">
      <button class="nav-btn ${prev>=0?"":"disabled"}" onclick="${prev>=0?`openDetail(${prev})`:""}">
        ← ${prev>=0?plants[prev].cn:"没有更多了"}
      </button>
      <button class="nav-btn ${next>=0?"":"disabled"}" onclick="${next>=0?`openDetail(${next})`:""}">
        ${next>=0?plants[next].cn:"没有更多了"} →
      </button>
    </div>`;
  overlay.classList.add("active");
  document.body.style.overflow="hidden";
}

function closeDetail(){
  overlay.classList.remove("active");
  document.body.style.overflow="";
  currentIdx=-1;
}

function showGallery(){
  closeDetail();
  searchInput.value="";
  filterPlants();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

/* SECTION: init */
renderGrid(plants);
</script>
